<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>拍照错题本 · 录错题</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="app.js"></script>
</head><body>
<div class="camscreen" id="camScreen">
<div class="cam-top"><a href="home.html">← 回主页</a><span class="cam-tip" id="camTip">正在打开相机…请允许使用相机权限</span></div>
<video id="camVideo" autoplay playsinline muted></video>
<div class="cam-controls">
<button type="button" class="switch-btn" id="switchCam">换摄像头</button>
<button type="button" class="shoot-btn" id="shootBtn">拍照</button>
<label class="album-btn" title="打开相册，选已有照片">相册<input type="file" accept="image/*" id="file" class="hidden"></label>
</div>
</div>
<canvas id="camCanvas" class="hidden"></canvas>
<main class="zyb-page zyb-full">
<input type="file" accept="image/*" capture="environment" id="camera" class="hidden">
<div class="zyb-stage-wrap"><div class="zyb-stage" id="stage"><p style="padding:20px;line-height:1.6">还没选照片。拍完或从相册选完后，照片会在这里按原宽高比满宽显示，不裁剪、不拉伸。</p></div></div>
<p style="margin:0;padding:8px 16px 0"><button type="button" class="secondary" id="addBox" style="margin-top:0">手动补框：在照片上拖一下，框出没框住的题</button>
<button type="button" class="secondary" id="retakeBtn2" style="margin-top:0">重新拍摄</button>
<button type="button" id="recognize" style="margin-top:0">识别所选题目</button></p>
<p class="zyb-hint" id="ocrNote">点框是选 / 取消选；按住框身拖动可以移动框；按住框右下角圆点可以调宽和高。框不准先别急着保存，先调好框。</p>
<p class="zyb-hint">这是真实识别：点“识别”会把每个选中框裁出来发给能看图的 DeepSeek 模型读题干、选项和正确答案，照片只临时发给模型看一次，不存云端。下面解析面板里的题目、答案、步骤如果还没识别出来，会先显示“正在识别…”，不会用假题目冒充真实识别。</p>
<div style="height:96px"></div>
</main>
<div class="zyb-bar" id="zybBar"><span class="zyb-count" id="zybCount">已选 0 道</span><button type="button" id="zybRecordBtn">记录错题</button></div>
<div class="zyb-backdrop" id="zybBackdrop"></div>
<section class="zyb-sheet" id="zybSheet" aria-label="题目解析面板">
<div class="zyb-grab" id="zybGrab"></div>
<button type="button" class="zyb-close" id="zybClose" title="收起解析面板">×</button>
<div class="zyb-tabs" id="zybTabs"></div>
<div class="zyb-body" id="zybBody"><p class="small">还没识别出题目。先在照片上点框选好题目，再点底部“记录错题”或“识别所选题目”。</p></div>
</section>
<script>
let boxes = [];
let currentPhotoFile = null;
let currentPhotoDataUrl = "";
let camStream = null;
let facing = "environment";
const stage = document.getElementById("stage");
const video = document.getElementById("camVideo");
const tip = document.getElementById("camTip");
const camScreen = document.getElementById("camScreen");
async function startCamera(){
  camScreen.style.display = "flex";
  try {
    if (camStream) camStream.getTracks().forEach(t => t.stop());
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: false });
    video.srcObject = camStream;
    video.style.display = "block";
    tip.textContent = "对着题目，点中间粉色按钮拍照，右下角相册可以选已有照片";
  } catch(e) {
    tip.textContent = "相机打不开：请允许相机权限，或点下面“打不开相机？用系统相机拍照”，也可以直接点右下角相册";
    video.style.display = "none";
  }
}
function stopCamera(){
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  camScreen.style.display = "none";
}
function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
function updateBar(){
  const sel = boxes.filter(b => b.selected);
  document.getElementById("zybCount").textContent = "已选 " + sel.length + " 道";
}
function renumberSelected(){
  const sel = boxes.filter(b => b.selected).sort((a,b) => (a.selOrder||0) - (b.selOrder||0));
  sel.forEach((b,i) => b.selOrder = i+1);
}
function renderBoxes(){
  stage.querySelectorAll(".zyb-box").forEach(n => n.remove());
  boxes.forEach((b, i) => {
    const d = document.createElement("div");
    d.className = "zyb-box" + (b.selected ? " zyb-selected" : "");
    d.style.left = b.x + "%"; d.style.top = b.y + "%";
    d.style.width = b.w + "%"; d.style.height = b.h + "%";
    const numLabel = b.selected ? String(b.selOrder || "") : String(i+1);
    d.innerHTML = "<span class=\"zyb-num\">" + numLabel + "</span><div class=\"zyb-del\" title=\"删掉这个框\">×</div><div class=\"zyb-handle\" title=\"拖这个圆点调宽和高\"></div>";
    let mode = null, startX = 0, startY = 0, orig = null;
    const posOf = (e) => {
      const r = stage.getBoundingClientRect();
      const tt = e.touches ? e.touches[0] : e;
      return { x: (tt.clientX - r.left) / r.width * 100, y: (tt.clientY - r.top) / r.height * 100 };
    };
    d.addEventListener("pointerdown", (e) => {
      if (e.target.classList.contains("zyb-del")) return;
      mode = e.target.classList.contains("zyb-handle") ? "resize" : "move";
      const pp = posOf(e);
      startX = pp.x; startY = pp.y;
      orig = { x: b.x, y: b.y, w: b.w, h: b.h };
      d.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    d.addEventListener("pointermove", (e) => {
      if (!mode) return;
      const pp = posOf(e);
      const dx = pp.x - startX, dy = pp.y - startY;
      if (mode === "move") {
        b.x = clamp(orig.x + dx, 0, 100 - b.w);
        b.y = clamp(orig.y + dy, 0, 100 - b.h);
      } else {
        b.w = clamp(orig.w + dx, 5, 100 - b.x);
        b.h = clamp(orig.h + dy, 3, 100 - b.y);
      }
      d.style.left = b.x + "%"; d.style.top = b.y + "%";
      d.style.width = b.w + "%"; d.style.height = b.h + "%";
    });
    d.addEventListener("pointerup", (e) => {
      if (!mode) return;
      const pp = posOf(e);
      const moved = Math.abs(pp.x - startX) + Math.abs(pp.y - startY);
      mode = null;
      if (moved < 1) {
        b.selected = !b.selected;
        if (b.selected) { b.selOrder = (Math.max(0, ...boxes.map(x => x.selOrder || 0)) + 1); }
        else { b.selOrder = 0; renumberSelected(); }
      }
      renderBoxes();
    });
    d.querySelector(".zyb-del").onclick = (e) => {
      e.stopPropagation();
      boxes.splice(i, 1);
      renumberSelected();
      renderBoxes();
    };
    stage.appendChild(d);
  });
  updateBar();
}
// 在照片上拖一下，补一个新框：按住空白处拖动，松手就生成一个框。
let dragStart = null;
stage.addEventListener("pointerdown", (e) => {
  if (e.target !== stage && e.target.tagName !== "IMG") return;
  const r = stage.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  dragStart = { x: (t.clientX - r.left) / r.width * 100, y: (t.clientY - r.top) / r.height * 100 };
});
stage.addEventListener("pointerup", (e) => {
  if (!dragStart) return;
  const r = stage.getBoundingClientRect();
  const t = e.changedTouches ? e.changedTouches[0] : e;
  const x2 = (t.clientX - r.left) / r.width * 100, y2 = (t.clientY - r.top) / r.height * 100;
  const x = Math.min(dragStart.x, x2), y = Math.min(dragStart.y, y2);
  const w = Math.abs(x2 - dragStart.x), h = Math.abs(y2 - dragStart.y);
  dragStart = null;
  if (w > 3 && h > 2) {
    boxes.push({ x: x, y: y, w: w, h: h, selected: false, selOrder: 0, label: "手动框 " + (boxes.length + 1) });
    renderBoxes();
  }
});
async function showImage(file){
  if (!file) return;
  currentPhotoFile = file;
  const reader = new FileReader();
  reader.onload = () => { currentPhotoDataUrl = reader.result; };
  reader.readAsDataURL(file);
  const url = URL.createObjectURL(file);
  stage.innerHTML = '<img id="photo" src="' + url + '" alt="上传的照片预览（不存储）">';
  boxes = [];
  renderBoxes();
  stopCamera();
  document.getElementById("stage").scrollIntoView({behavior:"smooth"});
  document.getElementById("ocrNote").textContent = "正在试智能框选…如果一会儿没出框，说明这次没认出题号，请直接在照片上拖一下手动框选，不要等。";
  // 智能框选：本机文字识别找题号。上一版在数学题、横拍照片上经常认不出，
  // 这次改成：认不出就直接说认不出，不再给固定假框，手动框选才是兜底。
  try {
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    document.head.appendChild(script);
    await new Promise((res, rej) => { script.onload = res; script.onerror = rej; });
    const worker = await Tesseract.createWorker("chi_sim+eng");
    const result = await worker.recognize(file);
    await worker.terminate();
    const words = (result.data.words || []).filter(w => w && w.bbox);
    const starts = [];
    for (const w of words) {
      const txt = (w.text || "").trim();
      const m = txt.match(/^(\d{1,2})[\.、．]/) || txt.match(/^第(\d{1,2})题/);
      if (m) starts.push({ n: parseInt(m[1], 10), x0: w.bbox.x0, y0: w.bbox.y0 });
    }
    starts.sort((a, b) => a.y0 - b.y0 || a.x0 - b.x0);
    const img = document.getElementById("photo");
    const H = img.naturalHeight || 1000;
    if (starts.length >= 1) {
      for (let i = 0; i < starts.length; i++) {
        const s = starts[i];
        const next = starts[i+1];
        const yTop = Math.max(0, s.y0 - 8);
        const yBottom = next ? Math.max(yTop + 20, next.y0 - 8) : H;
        boxes.push({ x: 2, y: yTop / H * 100, w: 96, h: (yBottom - yTop) / H * 100, selected: false, selOrder: 0, label: "第 " + s.n + " 题" });
      }
      renderBoxes();
      document.getElementById("ocrNote").textContent = "智能框选出 " + boxes.length + " 道题，框不准就拖右下角圆点调宽和高，或拖框身移动。";
    } else {
      document.getElementById("ocrNote").textContent = "这次没认出题号（数学符号、横拍、手写遮题号都容易认不出），请直接在照片上拖一下手动框选，框好再点框选错题。";
    }
  } catch(e) {
    document.getElementById("ocrNote").textContent = "智能框选没跑起来（可能是网络或识别失败），请直接在照片上拖一下手动框选，框好再点框选错题。";
  }
}
function showImageFromCanvas(){
  const canvas = document.getElementById("camCanvas");
  canvas.width = video.videoWidth || 1280;
  canvas.height = video.videoHeight || 720;
  canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(blob => { if (blob) showImage(blob); }, "image/jpeg", 0.9);
}
document.getElementById("shootBtn").onclick = showImageFromCanvas;
document.getElementById("switchCam").onclick = async () => {
  facing = facing === "environment" ? "user" : "environment";
  await startCamera();
};
document.getElementById("camera").addEventListener("change", e => showImage(e.target.files[0]));
document.getElementById("file").addEventListener("change", e => showImage(e.target.files[0]));
document.getElementById("addBox").onclick = () => {
  boxes.push({x:5, y:10 + boxes.length*8, w:90, h:20, selected:false, selOrder:0, label:"手动框 " + (boxes.length+1)});
  renderBoxes();
  PWQ.toast("已补一个框：按住框身可以移动，按住右下角圆点可以调宽和高，也可以在照片空白处直接拖一个新框。");
};
document.getElementById("retakeBtn2").onclick = async () => { await startCamera(); };
let sheetCards = [];
let sheetIndex = 0;
function openSheet(mode){
  const sheet = document.getElementById("zybSheet");
  const backdrop = document.getElementById("zybBackdrop");
  sheet.classList.remove("peek");
  sheet.classList.add("open");
  backdrop.classList.add("show");
  if (mode === "peek") { sheet.classList.remove("open"); sheet.classList.add("peek"); }
}
function closeSheet(){
  const sheet = document.getElementById("zybSheet");
  const backdrop = document.getElementById("zybBackdrop");
  sheet.classList.remove("open"); sheet.classList.remove("peek");
  backdrop.classList.remove("show");
}
function renderSheet(){
  const tabs = document.getElementById("zybTabs");
  const body = document.getElementById("zybBody");
  tabs.innerHTML = "";
  if (!sheetCards.length) {
    body.innerHTML = "<p class=\"small\">还没识别出题目。先在照片上点框选好题目，再点底部“记录错题”或“识别所选题目”。</p>";
    return;
  }
  sheetCards.forEach((c, ci) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "zyb-tab" + (ci === sheetIndex ? " active" : "");
    btn.textContent = String(ci+1);
    btn.onclick = () => { sheetIndex = ci; renderSheet(); };
    tabs.appendChild(btn);
  });
  const c = sheetCards[sheetIndex];
  const optsHtml = (c.options && c.options.length) ? c.options.map(o => {
    const letter = o.trim().charAt(0);
    const isAns = letter === c.answer;
    return "<div class='opt " + (isAns ? "correct" : "") + "' data-letter='" + letter + "'><span>" + PWQ.escapeHtml(o) + "</span>" + (isAns ? "<span class='mark'>正确答案</span>" : "") + "</div>";
  }).join("") : "<p class=\"small\">这道题没有选项（判断题或主观题），下面直接看答案和步骤。</p>";
  body.innerHTML = "<p><b>第 " + (sheetIndex+1) + " 题</b> <span class='tag subjectTag'>" + PWQ.escapeHtml(c.subject) + "</span><input class='subjectInput hidden' value='" + PWQ.escapeHtml(c.subject) + "' style='width:80px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px'></p>" +
    "<p><b>" + PWQ.escapeHtml(c.stem || "正在识别…") + "</b></p>" +
    optsHtml +
    "<p class='small' style='text-align:right'>点一下选项可以改正确答案</p>" +
    "<div class='explain'><b>红笔解析：</b><span>" + PWQ.escapeHtml(c.explain || "还没生成解析，点下面“生成解析并保存”后这里会显示步骤和知识点。") + "</span></div>" +
    "<p><button type='button' id='sheetSaveOne'>生成解析并保存这道题</button></p>" +
    "<p class='small'>学科在第几题旁边的小药丸上，点一下可以改，支持自定义；大题型、解析类型直接记在后台，不在页面上显示；错因已删掉，不用。</p>";
  // 选项点选改答案
  body.querySelectorAll(".opt").forEach(el => {
    el.onclick = () => { c.answer = el.dataset.letter; renderSheet(); };
  });
  // 学科点改
  const tag = body.querySelector(".subjectTag");
  const input = body.querySelector(".subjectInput");
  if (tag && input) {
    tag.onclick = () => { tag.classList.add("hidden"); input.classList.remove("hidden"); input.focus(); input.select(); };
    const saveSub = () => { const v = input.value.trim() || c.subject; c.subject = v; tag.classList.remove("hidden"); input.classList.add("hidden"); renderSheet(); };
    input.addEventListener("blur", saveSub);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });
  }
  const saveBtn = body.querySelector("#sheetSaveOne");
  if (saveBtn) {
    if (c.saved) { saveBtn.textContent = "这道题已经保存过了"; saveBtn.disabled = true; }
    saveBtn.onclick = async () => {
      if (c.saved || c.saving) { PWQ.toast("这道题已经保存过了，不会重复存。"); return; }
      c.saving = true; saveBtn.disabled = true; saveBtn.textContent = "正在保存…";
      await PWQ.ready();
      if (!PWQ.currentUser()) { c.saving = false; saveBtn.disabled = false; saveBtn.textContent = "生成解析并保存这道题"; PWQ.toast("请先去登录页登录，登录后才能把题存到云端。"); location.href = "index.html"; return; }
      const batch = "未分组";
      const q = { subject: c.subject, qkind: c.qkind, type: c.type, stem: c.stem, options: c.options, answer: c.answer, explain: "", reason: "", batch: batch, starred:false, mastered:false, streak:0, edited:false, note:"" };
      q.explain = await PWQ.explainPlaceholder({stem: q.stem, options: q.options, answer: q.answer, type: q.type});
      c.explain = q.explain;
      try { await PWQ.addQuestion(q); } catch(e) { c.saving = false; if (String(e.message || e).includes("已经保存过了")) c.saved = true; PWQ.toast(String(e.message || e)); renderSheet(); return; }
      c.saved = true; c.saving = false;
      PWQ.toast("这道题已保存到云端错题库。");
      renderSheet();
    };
  }
}
document.getElementById("recognize").onclick = async () => {
  const sel = boxes.filter(b => b.selected).sort((a,b) => (a.selOrder||0) - (b.selOrder||0));
  if (!sel.length) {
    PWQ.toast("请先点方框选至少一道错题。");
    return;
  }
  const targets = sel;
  if (!currentPhotoDataUrl) { PWQ.toast("请先拍照或从相册选一张照片。"); return; }
  // 先打开抽屉占位，显示正在识别，不用假题目冒充真实识别
  sheetCards = targets.map(() => ({ stem: "正在识别…", options: [], answer: "", subject: "其他", qkind: "选择题", type: "定性辨析类", explain: "" }));
  sheetIndex = 0;
  renderSheet();
  openSheet("peek");
  PWQ.toast("正在用能看图的模型同时读 " + targets.length + " 道题，一般几秒到十几秒，读完会自动填进解析面板。");
  document.getElementById("ocrNote").textContent = "正在读题…多道题是一起读的，不是排队一道一道等，读完解析面板里会自动出题目和选项。";
  const img = document.getElementById("photo");
  const visionUrl = (window.APP_CONFIG && window.APP_CONFIG.VISION_FUNCTION_URL) || "https://mjsmrltdwcnzmstbjzry.supabase.co/functions/v1/vision";
  const anon = window.APP_CONFIG ? window.APP_CONFIG.SUPABASE_ANON_KEY : "";
  const cards = await Promise.all(targets.map(async (box) => {
    let stem = "", options = [], suggested = "", subject = "其他", qkind = "选择题", explain_type = "定性辨析类";
    try {
      const canvas = document.createElement("canvas");
      const iw = img.naturalWidth, ih = img.naturalHeight;
      const sx = Math.max(0, box.x / 100 * iw), sy = Math.max(0, box.y / 100 * ih);
      const sw = Math.min(iw - sx, box.w / 100 * iw), sh = Math.min(ih - sy, box.h / 100 * ih);
      canvas.width = Math.max(1, Math.round(sw)); canvas.height = Math.max(1, Math.round(sh));
      canvas.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      const cropDataUrl = canvas.toDataURL("image/jpeg", 0.9);
      const res = await fetch(visionUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + anon, "apikey": anon },
        body: JSON.stringify({ image: cropDataUrl }),
      });
      const data = await res.json();
      stem = PWQ.cleanLatex(data.stem || ""); options = (data.options || []).map(o => PWQ.cleanLatex(o)); suggested = data.suggested_answer || ""; subject = data.subject || "其他"; qkind = data.qkind || "选择题"; explain_type = data.explain_type || "定性辨析类";
    } catch(e) { stem = ""; options = []; suggested = ""; subject = "其他"; }
    return { stem, options, answer: suggested, subject, qkind, type: explain_type, explain: "" };
  }));
  sheetCards = cards;
  sheetIndex = 0;
  renderSheet();
  openSheet("open");
  PWQ.toast("识别完成，共 " + cards.length + " 道题，解析面板顶部点编号可以切换题目，点选项可以改正确答案。");
};
document.getElementById("zybRecordBtn").onclick = () => {
  if (sheetCards.length) { renderSheet(); openSheet("open"); return; }
  document.getElementById("recognize").click();
};
document.getElementById("zybClose").onclick = closeSheet;
document.getElementById("zybBackdrop").onclick = closeSheet;
// 抽屉手势：按住顶部抓手上下拖，松手按位置决定收起 / 半展开 / 全展开
(function(){
  const sheet = document.getElementById("zybSheet");
  const grab = document.getElementById("zybGrab");
  let startY = 0, startMode = "open", dragging = false;
  grab.addEventListener("pointerdown", (e) => {
    dragging = true; startY = e.clientY;
    startMode = sheet.classList.contains("peek") ? "peek" : "open";
    sheet.style.transition = "none";
    grab.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  grab.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dy = e.clientY - startY;
    // 只做视觉跟手，不直接改高度：用 translateY 跟手，松手再归位到三个档位
    const base = startMode === "peek" ? 52 : 0;
    const vh = window.innerHeight;
    const offsetVh = base + (dy / vh * 100);
    const clamped = Math.max(0, Math.min(105, offsetVh));
    sheet.style.transform = "translateY(" + clamped + "vh)";
    if (window.innerWidth >= 721) sheet.style.transform = "translateX(-50%) translateY(" + clamped + "vh)";
  });
  const endDrag = (e) => {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = "";
    sheet.style.transform = "";
    const dy = e.clientY - startY;
    if (dy > 120) closeSheet();
    else if (dy > 40) openSheet("peek");
    else openSheet("open");
  };
  grab.addEventListener("pointerup", endDrag);
  grab.addEventListener("pointercancel", endDrag);
})();

// 右滑返回（从屏幕右侧向左滑，Android 手势返回）：先在网站里退一步，不直接退出到浏览器主页。
// 原理：解析面板打开时压一条历史记录，返回先收起面板；面板没开时，上传页返回先回主页；主页再返回才真的退出。
let backSheetOpen = false;
const origOpenSheet = openSheet;
const origCloseSheet = closeSheet;
openSheet = function(mode){
  origOpenSheet(mode);
  if (!backSheetOpen) {
    backSheetOpen = true;
    try { history.pushState({zybSheet: true}, ""); } catch(e) {}
  }
};
closeSheet = function(){
  origCloseSheet();
  if (backSheetOpen) {
    backSheetOpen = false;
    // 如果当前历史就是我们压的那条，返回时不要再触发一次 popstate 循环
    // 这里不主动 history.back，由 popstate 处理；直接关面板即可。
  }
};
window.addEventListener("popstate", () => {
  const sheet = document.getElementById("zybSheet");
  if (sheet && (sheet.classList.contains("open") || sheet.classList.contains("peek"))) {
    backSheetOpen = false;
    origCloseSheet();
    return;
  }
  // 面板没开，上传页右滑返回：先回主页，不直接退出到浏览器主页
  if (location.pathname.endsWith("upload.html") || location.pathname.endsWith("/upload.html")) {
    location.href = "home.html";
  }
});
// 进入上传页时压一条历史，这样第一次右滑返回会先触发 popstate 回主页，而不是直接退出。
try { history.pushState({zybUpload: true}, ""); } catch(e) {}
// 点开这一页就直接是全屏相机，不用再点一次拍照按钮。
startCamera();
window.addEventListener("beforeunload", stopCamera);
</script>
