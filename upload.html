<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小错本">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6fbf8">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>小错本 · 录错题</title>
<link rel="stylesheet" href="styles.css">
<script src="supabase-js.js" defer onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'"></script>
<script src="config.js" defer></script><script src="app.js" defer></script>
</head><body>
<div class="camscreen" id="camScreen">
<div class="cam-top"><a href="home.html" aria-label="返回主页">←</a><span class="cam-tip" id="camTip">正在打开相机…请允许使用相机权限</span></div>
<video id="camVideo" autoplay playsinline muted></video>
<div class="cam-bottom" id="camBottomBar">
<div class="cam-left"><div class="cam-mode-btns"><button type="button" id="modeSingle" class="active">拍一页</button><button type="button" id="modeMulti">拍多页</button></div></div>
<div class="cam-center"><button type="button" class="shoot-btn" id="shootBtn" aria-label="拍照" title="拍照"></button></div>
<div class="cam-right"><label class="album-btn" title="打开相册，选已有照片">相册<input type="file" accept="image/*" id="file" class="hidden"></label><button type="button" class="confirm-btn" id="confirmPagesBtn" disabled>确认<span class="confirm-badge" id="confirmBadge">0</span></button></div>
</div>
</div>
<canvas id="camCanvas" class="hidden"></canvas>
<main class="zyb-page zyb-full">
<input type="file" accept="image/*" capture="environment" id="camera" class="hidden">
<div id="pageSwitcher" class="page-switcher hidden"><button type="button" id="prevPageBtn">← 上一页</button><span id="pageIndicator">第 1 / 1 页</span><button type="button" id="nextPageBtn">下一页 →</button><button type="button" class="secondary" id="delPageBtn">删掉这页</button></div>
<div class="zyb-stage-wrap"><div class="zyb-stage" id="stage"><p style="padding:20px;line-height:1.6">还没选照片。拍完或从相册选完后，照片会在这里按原宽高比满宽显示，不裁剪、不拉伸。</p></div></div>
<p style="margin:0;padding:8px 16px 0"><button type="button" class="secondary" id="addBox" style="margin-top:0">手动补框：在照片上拖一下，框出没框住的题</button>
<button type="button" class="secondary" id="retakeBtn2" style="margin-top:0">重新拍摄</button>
<button type="button" id="recognize" style="margin-top:0">识别所选题目</button></p>
<p class="zyb-hint" id="ocrNote">点框选中，拖框移动，拖右下角改大小。框准了再识别。</p>
<div style="height:16px"></div>
</main>
<div class="zyb-bar" id="zybBar"><span class="zyb-count" id="zybCount">已选 0 道</span><button type="button" id="zybRecordBtn">记录错题</button></div>
<div class="zyb-backdrop" id="zybBackdrop"></div>
<section class="zyb-sheet" id="zybSheet" aria-label="题目解析面板">
<div class="zyb-grab" id="zybGrab"></div>
<button type="button" class="zyb-close" id="zybClose" aria-label="收起解析面板" title="收起解析面板">×</button>
<div class="zyb-tabs" id="zybTabs"></div>
<div class="zyb-body" id="zybBody"><p class="small">还没识别出题目。先在照片上点框选好题目，再点底部“记录错题”或“识别所选题目”。</p></div>
</section>
<script>
let boxes = [];
let multiMode = false;
let photoPages = [];
let currentPageIndex = 0;
let currentPhotoFile = null;
let currentPhotoDataUrl = "";
let camStream = null;
let facing = "environment";
const stage = document.getElementById("stage");
const video = document.getElementById("camVideo");
const tip = document.getElementById("camTip");
const camScreen = document.getElementById("camScreen");
async function startCamera(){
  camScreen.style.display = "flex";
  if (PWQ.ensureNativePermissions) { try { await PWQ.ensureNativePermissions(); } catch (e0) {} }
  try {
    if (camStream) camStream.getTracks().forEach(t => t.stop());
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("no-getUserMedia");
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: false });
    video.srcObject = camStream;
    video.style.display = "block";
    tip.textContent = "对着题目，点中间绿色按钮拍照，右下角相册可以选已有照片";
  } catch(e) {
    tip.textContent = "预览打不开。点中间按钮用系统相机拍照，或点右下角相册选已有照片。";
    try { PWQ.toast("预览打不开，点中间按钮拍照，或点右下角相册"); } catch(e2) {}
    video.style.display = "none";
  }
}
async function captureFromSystem(source){
  if (PWQ.takeNativePhoto) {
    const nativeFile = await PWQ.takeNativePhoto(source);
    if (nativeFile) return nativeFile;
  }
  return null;
}
function stopCamera(){
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  camScreen.style.display = "none";
}
function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
function updateBar(){
  if (multiMode && photoPages.length) {
    const total = photoPages.reduce((s, pg) => s + pg.boxes.filter(b => b.selected).length, 0);
    document.getElementById("zybCount").textContent = "已选 " + total + " 道";
    return;
  }
  const sel = boxes.filter(b => b.selected);
  document.getElementById("zybCount").textContent = "已选 " + sel.length + " 道";
}
function renumberSelected(){
  const sel = boxes.filter(b => b.selected).sort((a,b) => (a.selOrder||0) - (b.selOrder||0));
  sel.forEach((b,i) => b.selOrder = i+1);
}
function renderBoxes(){
  stage.querySelectorAll(".zyb-box").forEach(n => n.remove());
  boxes.forEach((b, i) => {
    const d = document.createElement("div");
    d.className = "zyb-box" + (b.selected ? " zyb-selected" : "");
    d.style.left = b.x + "%"; d.style.top = b.y + "%";
    d.style.width = b.w + "%"; d.style.height = b.h + "%";
    const numLabel = b.selected ? String(b.selOrder || (i+1)) : String(i+1);
    d.innerHTML = "<span class=\"zyb-num\">" + numLabel + "</span><div class=\"zyb-del\" role=\"button\" aria-label=\"删除这个框\" title=\"删掉这个框\">×</div><div class=\"zyb-handle\" role=\"button\" aria-label=\"调整框的大小\" title=\"拖这个圆点调宽和高\">↩</div>";
    let mode = null, startX = 0, startY = 0, orig = null;
    const posOf = (e) => {
      const r = stage.getBoundingClientRect();
      const tt = e.touches ? e.touches[0] : e;
      return { x: (tt.clientX - r.left) / r.width * 100, y: (tt.clientY - r.top) / r.height * 100 };
    };
    d.addEventListener("pointerdown", (e) => {
      if (e.target.classList.contains("zyb-del")) return;
      mode = e.target.classList.contains("zyb-handle") ? "resize" : "move";
      const pp = posOf(e);
      startX = pp.x; startY = pp.y;
      orig = { x: b.x, y: b.y, w: b.w, h: b.h };
      d.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    d.addEventListener("pointermove", (e) => {
      if (!mode) return;
      const pp = posOf(e);
      const dx = pp.x - startX, dy = pp.y - startY;
      if (mode === "move") {
        b.x = clamp(orig.x + dx, 0, 100 - b.w);
        b.y = clamp(orig.y + dy, 0, 100 - b.h);
      } else {
        b.w = clamp(orig.w + dx, 5, 100 - b.x);
        b.h = clamp(orig.h + dy, 3, 100 - b.y);
      }
      d.style.left = b.x + "%"; d.style.top = b.y + "%";
      d.style.width = b.w + "%"; d.style.height = b.h + "%";
    });
    d.addEventListener("pointerup", (e) => {
      if (!mode) return;
      const pp = posOf(e);
      const moved = Math.abs(pp.x - startX) + Math.abs(pp.y - startY);
      mode = null;
      if (moved < 1) {
        b.selected = !b.selected;
        if (b.selected) { b.selOrder = (Math.max(0, ...boxes.map(x => x.selOrder || 0)) + 1); }
        else { b.selOrder = 0; renumberSelected(); }
      }
      renderBoxes();
    });
    d.querySelector(".zyb-del").onclick = (e) => {
      e.stopPropagation();
      boxes.splice(i, 1);
      renumberSelected();
      renderBoxes();
    };
    stage.appendChild(d);
  });
  updateBar();
}
// 在照片上拖出新框。必须挡住图片原生拖拽和页面滚动，并用 pointer capture，
// 否则桌面会拖走图片，手机上手指一滑手势就被浏览器拿走，框就画不出来。
let drawGesture = null;
function stagePoint(e) {
  const r = stage.getBoundingClientRect();
  const w = r.width || 1, h = r.height || 1;
  return {
    x: Math.max(0, Math.min(100, (e.clientX - r.left) / w * 100)),
    y: Math.max(0, Math.min(100, (e.clientY - r.top) / h * 100))
  };
}
function canStartDraw(e) {
  if (e.button != null && e.button !== 0) return false;
  const t = e.target;
  if (t === stage || t.id === "photo" || (t.tagName === "IMG" && stage.contains(t))) return true;
  return false;
}
function paintDraft(a, b) {
  let el = stage.querySelector(".zyb-drawing");
  if (!el) {
    el = document.createElement("div");
    el.className = "zyb-box zyb-drawing";
    el.setAttribute("aria-hidden", "true");
    stage.appendChild(el);
  }
  const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
  el.style.left = x + "%";
  el.style.top = y + "%";
  el.style.width = Math.abs(b.x - a.x) + "%";
  el.style.height = Math.abs(b.y - a.y) + "%";
}
function clearDraft() {
  const el = stage.querySelector(".zyb-drawing");
  if (el) el.remove();
}
function endDraw(e) {
  if (!drawGesture || e.pointerId !== drawGesture.id) return;
  const end = stagePoint(e);
  const a = drawGesture.start;
  drawGesture = null;
  clearDraft();
  const x = Math.min(a.x, end.x), y = Math.min(a.y, end.y);
  const w = Math.abs(end.x - a.x), h = Math.abs(end.y - a.y);
  if (w > 2.5 && h > 1.8) {
    boxes.push({ x: x, y: y, w: w, h: h, selected: false, selOrder: 0, label: "手动框 " + (boxes.length + 1) });
    renderBoxes();
  }
}
stage.addEventListener("pointerdown", (e) => {
  if (!canStartDraw(e)) return;
  if (drawGesture) return;
  e.preventDefault();
  const p = stagePoint(e);
  drawGesture = { id: e.pointerId, start: p };
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  paintDraft(p, p);
});
stage.addEventListener("pointermove", (e) => {
  if (!drawGesture || e.pointerId !== drawGesture.id) return;
  e.preventDefault();
  paintDraft(drawGesture.start, stagePoint(e));
});
stage.addEventListener("pointerup", endDraw);
stage.addEventListener("pointercancel", (e) => {
  if (!drawGesture || e.pointerId !== drawGesture.id) return;
  drawGesture = null;
  clearDraft();
});
async function showImage(file){
  if (!file) return;
  currentPhotoFile = file;
  const reader = new FileReader();
  reader.onload = () => { currentPhotoDataUrl = reader.result; };
  reader.readAsDataURL(file);
  const url = URL.createObjectURL(file);
  stage.innerHTML = '<img id="photo" draggable="false" src="' + url + '" alt="上传的照片预览（不存储）">';
  boxes = [];
  renderBoxes();
  stopCamera();
  document.getElementById("stage").scrollIntoView({behavior:"smooth"});
  document.getElementById("ocrNote").textContent = "自动框选已取消，只手动选：在照片上拖一下框出题目，点框是选 / 取消选，框不准拖框身移动、拖右下角圆点调宽和高。";
}
function showImageFromCanvas(){
  const canvas = document.getElementById("camCanvas");
  canvas.width = video.videoWidth || 1280;
  canvas.height = video.videoHeight || 720;
  canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(blob => { if (blob) { if (multiMode) addPage(blob); else showImage(blob); } }, "image/jpeg", 0.9);
}

function updateCamUI(){
  document.getElementById("modeSingle").classList.toggle("active", !multiMode);
  document.getElementById("modeMulti").classList.toggle("active", multiMode);
  // 确认按钮始终在布局里占位，位置和大小固定，不因模式或张数出现、消失或挤动别人。
  const confirmBtn = document.getElementById("confirmPagesBtn");
  const badge = document.getElementById("confirmBadge");
  if (confirmBtn) {
    if (!multiMode) {
      // 拍一页模式：确认置灰不可点，角标隐藏但按钮仍占位。
      confirmBtn.disabled = true;
      if (badge) badge.style.visibility = "hidden";
    } else {
      // 拍多页模式：没拍过置灰不可点，拍了至少一张变红可点，角标显示已拍张数，绝对定位不占布局空间。
      confirmBtn.disabled = photoPages.length === 0;
      if (badge) { badge.textContent = String(photoPages.length); badge.style.visibility = "visible"; }
    }
  }
  const shoot = document.getElementById("shootBtn");
  shoot.disabled = multiMode && photoPages.length >= 5;
  shoot.style.opacity = shoot.disabled ? "0.5" : "";
  const sw = document.getElementById("pageSwitcher");
  if (sw) sw.classList.toggle("hidden", !(multiMode && photoPages.length));
  const ind = document.getElementById("pageIndicator");
  if (ind && photoPages.length) ind.textContent = "第 " + (currentPageIndex + 1) + " / " + photoPages.length + " 页";
}
function setMode(multi){
  if (multi === multiMode) return;
  if (!multi && photoPages.length) {
    if (!confirm("切回单页会清空已拍的多页照片，确定吗？")) return;
    photoPages = []; currentPageIndex = 0;
  }
  multiMode = multi;
  if (!multiMode) document.getElementById("pageSwitcher").classList.add("hidden");
  updateCamUI();
}
function addPage(file){
  if (!file) return;
  if (photoPages.length >= 5) { PWQ.toast("最多同时拍 5 页，已拍满，点右下角确认进框选。"); updateCamUI(); return; }
  const url = URL.createObjectURL(file);
  const reader = new FileReader();
  reader.onload = () => {
    photoPages.push({url: url, dataUrl: reader.result, boxes: []});
    updateCamUI();
    PWQ.toast("已拍第 " + photoPages.length + " 页" + (photoPages.length >= 5 ? "，已满 5 页，点右下角确认。" : "，还能再拍 " + (5 - photoPages.length) + " 页。"));
  };
  reader.readAsDataURL(file);
}
function showMultiPage(index){
  if (!photoPages.length) return;
  currentPageIndex = Math.max(0, Math.min(photoPages.length - 1, index));
  const page = photoPages[currentPageIndex];
  boxes = page.boxes;
  currentPhotoFile = null;
  currentPhotoDataUrl = page.dataUrl;
  stage.innerHTML = '<img id="photo" draggable="false" src="' + page.url + '" alt="第 ' + (currentPageIndex + 1) + ' 页照片">';
  renderBoxes();
  document.getElementById("pageSwitcher").classList.remove("hidden");
  document.getElementById("pageIndicator").textContent = "第 " + (currentPageIndex + 1) + " / " + photoPages.length + " 页";
  document.getElementById("ocrNote").textContent = "多页手动框选：第 " + (currentPageIndex + 1) + " / " + photoPages.length + " 页，在这页上拖一下框出题目，点框是选 / 取消选；点上一页 / 下一页切换，每页框好的题最后会一起识别。";
  const stageEl = document.getElementById("stage");
  if (stageEl && stageEl.scrollIntoView) stageEl.scrollIntoView({behavior:"smooth"});
}
document.getElementById("modeSingle").onclick = () => setMode(false);
document.getElementById("modeMulti").onclick = () => setMode(true);
document.getElementById("confirmPagesBtn").onclick = () => {
  if (!photoPages.length) { PWQ.toast("还没拍，先拍至少一页。"); return; }
  stopCamera();
  showMultiPage(currentPageIndex < photoPages.length ? currentPageIndex : 0);
};
document.getElementById("prevPageBtn").onclick = () => showMultiPage(currentPageIndex - 1);
document.getElementById("nextPageBtn").onclick = () => showMultiPage(currentPageIndex + 1);
document.getElementById("delPageBtn").onclick = () => {
  if (!confirm("删掉这页吗？这页上框好的题也会一起删掉。")) return;
  photoPages.splice(currentPageIndex, 1);
  if (!photoPages.length) {
    boxes = [];
    stage.innerHTML = '<p style="padding:20px;line-height:1.6">这页已删掉，没有照片了。点“重新拍摄”再拍。</p>';
    document.getElementById("pageSwitcher").classList.add("hidden");
    updateCamUI();
    startCamera();
    return;
  }
  updateCamUI();
  showMultiPage(Math.min(currentPageIndex, photoPages.length - 1));
};
updateCamUI();
document.getElementById("shootBtn").onclick = async () => {
  if (camStream && video.videoWidth) { showImageFromCanvas(); return; }
  const file = await captureFromSystem("camera");
  if (file) { if (multiMode) addPage(file); else showImage(file); return; }
  document.getElementById("camera").click();
};
document.getElementById("camera").addEventListener("change", e => { const f = e.target.files[0]; if (!f) return; if (multiMode) addPage(f); else showImage(f); e.target.value = ""; });
document.getElementById("file").addEventListener("change", e => { const f = e.target.files[0]; if (!f) return; if (multiMode) addPage(f); else showImage(f); e.target.value = ""; });
let albumBusy = false;
document.querySelector(".album-btn").addEventListener("click", async (e) => {
  if (!PWQ.isNativeApp || !PWQ.isNativeApp()) return;
  if (albumBusy) return;
  e.preventDefault();
  albumBusy = true;
  try {
    const file = await captureFromSystem("photos");
    if (file) { if (multiMode) addPage(file); else showImage(file); return; }
    document.getElementById("file").click();
  } finally {
    albumBusy = false;
  }
});
document.getElementById("addBox").onclick = () => {
  boxes.push({x:5, y:10 + boxes.length*8, w:90, h:20, selected:false, selOrder:0, label:"手动框 " + (boxes.length+1)});
  renderBoxes();
  PWQ.toast("已补一个框：按住框身可以移动，按住右下角圆点可以调宽和高，也可以在照片空白处直接拖一个新框。");
};
document.getElementById("retakeBtn2").onclick = async () => { await startCamera(); };
let sheetCards = [];
let sheetIndex = 0;
function openSheet(mode){
  const sheet = document.getElementById("zybSheet");
  const backdrop = document.getElementById("zybBackdrop");
  sheet.classList.remove("peek");
  sheet.classList.add("open");
  backdrop.classList.add("show");
  if (mode === "peek") { sheet.classList.remove("open"); sheet.classList.add("peek"); }
}
function closeSheet(){
  const sheet = document.getElementById("zybSheet");
  const backdrop = document.getElementById("zybBackdrop");
  sheet.classList.remove("open"); sheet.classList.remove("peek");
  backdrop.classList.remove("show");
}
function optionPlain(o){ return String(o || "").replace(/^[A-D][\.、．:：]\s*/i, "").trim(); }
function flushSheetFields(){
  const body = document.getElementById("zybBody");
  const c = sheetCards[sheetIndex];
  if (!c || !body || c.pending) return;
  const stemEl = body.querySelector(".stem-edit");
  if (stemEl) c.stem = stemEl.value;
  const optEls = body.querySelectorAll(".opt-edit");
  if (optEls.length) {
    c.options = Array.from(optEls).map((el, i) => {
      const plain = el.value.replace(/^[A-D][\.、．:：]\s*/i, "").trim();
      return plain ? (String.fromCharCode(65 + i) + ". " + plain) : "";
    });
  }
  const ansEl = body.querySelector(".answer-edit");
  if (ansEl && !(c.options || []).some(optionPlain)) c.answer = ansEl.value.trim();
}
function renderSheet(){
  const tabs = document.getElementById("zybTabs");
  const body = document.getElementById("zybBody");
  tabs.innerHTML = "";
  if (!sheetCards.length) {
    body.innerHTML = "<p class=\"small\">还没识别出题目。先在照片上点框选好题目，再点底部“记录错题”或“识别所选题目”。</p>";
    return;
  }
  sheetCards.forEach((card, ci) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "zyb-tab" + (ci === sheetIndex ? " active" : "");
    btn.textContent = String(ci+1);
    btn.onclick = () => { flushSheetFields(); sheetIndex = ci; renderSheet(); };
    tabs.appendChild(btn);
  });
  const c = sheetCards[sheetIndex];
  if (c.pending) {
    body.innerHTML = "<p><b>第 " + (sheetIndex+1) + " 题</b></p><p>正在识别…</p><p><button type='button' id='sheetSaveOne' disabled>生成解析并保存这道题</button></p>";
    return;
  }
  const failHtml = c.failed ? "<p class='recog-fail'>没读出来，重拍或手动补</p>" : "";
  const optRows = (c.options || []).map((o, i) => {
    const letter = String.fromCharCode(65 + i);
    const on = String(c.answer || "").toUpperCase().charAt(0) === letter ? " on" : "";
    return "<div class='opt-edit-row'><button type='button' class='set-ans" + on + "' data-letter='" + letter + "' aria-label='把" + letter + "标为正确答案'>" + letter + "</button><textarea class='opt-edit' rows='2' aria-label='选项" + letter + "'>" + PWQ.escapeHtml(optionPlain(o)) + "</textarea><button type='button' class='secondary opt-del' data-i='" + i + "' aria-label='删除选项" + letter + "'>删除</button></div>";
  }).join("");
  const hasRealOpt = (c.options || []).some(optionPlain);
  const ansHtml = hasRealOpt ? "" : "<label class='sheet-label'>正确答案</label><textarea class='answer-edit' rows='2' aria-label='正确答案' placeholder='判断题写对或错，主观题写参考答案'>" + PWQ.escapeHtml(c.answer || "") + "</textarea>";
  const stemEmpty = !String(c.stem || "").trim();
  body.innerHTML = "<p><b>第 " + (sheetIndex+1) + " 题</b> <span class='tag subjectTag' title='点一下改学科'>" + PWQ.escapeHtml(c.subject || "其他") + "</span><input class='subjectInput hidden' value='" + PWQ.escapeHtml(c.subject || "其他") + "' aria-label='学科' style='width:120px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px'></p>" +
    failHtml +
    "<label class='sheet-label'>题干</label><textarea class='stem-edit' rows='4' aria-label='题干' placeholder='识别不到就在这里手打题干'>" + PWQ.escapeHtml(c.stem || "") + "</textarea>" +
    (optRows ? "<label class='sheet-label'>选项</label>" + optRows : "") +
    "<p><button type='button' class='secondary' id='addOptBtn'>加一个选项</button></p>" +
    ansHtml +
    "<div class='explain'><b>红笔解析：</b><span>" + PWQ.escapeHtml(c.explain || "保存时会生成解析。") + "</span></div>" +
    "<p><button type='button' id='sheetSaveOne'" + (c.saved || stemEmpty ? " disabled" : "") + ">" + (c.saved ? "这道题已经保存过了" : "生成解析并保存这道题") + "</button></p>";
  const stemEl = body.querySelector(".stem-edit");
  const saveBtn = body.querySelector("#sheetSaveOne");
  const refreshSave = () => {
    if (!saveBtn || c.saved) return;
    saveBtn.disabled = !stemEl.value.trim();
  };
  if (stemEl) stemEl.addEventListener("input", () => { c.stem = stemEl.value; c.failed = false; const fail = body.querySelector(".recog-fail"); if (fail && stemEl.value.trim()) fail.hidden = true; refreshSave(); });
  body.querySelectorAll(".opt-edit").forEach(el => el.addEventListener("input", () => flushSheetFields()));
  const ansEl = body.querySelector(".answer-edit");
  if (ansEl) ansEl.addEventListener("input", () => { c.answer = ansEl.value; });
  body.querySelectorAll(".set-ans").forEach(el => { el.onclick = () => { flushSheetFields(); c.answer = el.dataset.letter; renderSheet(); }; });
  body.querySelectorAll(".opt-del").forEach(el => { el.onclick = () => { flushSheetFields(); c.options.splice(Number(el.dataset.i), 1); renderSheet(); }; });
  const addBtn = body.querySelector("#addOptBtn");
  if (addBtn) addBtn.onclick = () => { flushSheetFields(); if (!c.options) c.options = []; c.options.push(""); renderSheet(); };
  const tag = body.querySelector(".subjectTag");
  const input = body.querySelector(".subjectInput");
  if (tag && input) {
    tag.onclick = () => { tag.classList.add("hidden"); input.classList.remove("hidden"); input.focus(); input.select(); };
    const saveSub = () => { c.subject = input.value.trim() || c.subject || "其他"; renderSheet(); };
    input.addEventListener("blur", saveSub);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });
  }
  if (saveBtn) {
    saveBtn.onclick = async () => {
      flushSheetFields();
      if (c.saved || c.saving) { PWQ.toast("这道题已经保存过了，不会重复存。"); return; }
      if (c.pending) { PWQ.toast("还在识别，请稍等。", "error"); return; }
      const stem = String(c.stem || "").trim();
      if (!stem) { PWQ.toast("题干是空的，不能保存。没读出来就手动补上题干。", "error"); refreshSave(); return; }
      const opts = (c.options || []).filter(optionPlain);
      c.stem = stem;
      c.options = opts;
      if (opts.length) { if (c.qkind === "主观题") c.qkind = "选择题"; }
      else if (c.qkind === "选择题") c.qkind = "主观题";
      c.saving = true; saveBtn.disabled = true; saveBtn.textContent = "正在保存…";
      await PWQ.ready({ questions: true });
      if (!PWQ.currentUser()) { c.saving = false; saveBtn.disabled = false; saveBtn.textContent = "生成解析并保存这道题"; PWQ.toast("请先去登录页登录，登录后才能把题存到云端。"); location.href = "index.html"; return; }
      const q = { subject: c.subject, qkind: c.qkind, type: c.type, stem: c.stem, options: c.options, answer: c.answer, explain: "", reason: "", batch: "未分组", starred:false, mastered:false, streak:0, edited:false, note:"" };
      q.explain = await PWQ.explainPlaceholder({stem: q.stem, options: q.options, answer: q.answer, type: q.type});
      c.explain = q.explain;
      try { await PWQ.addQuestion(q); } catch(e) { c.saving = false; if (String(e.message || e).includes("已经保存过了") || String(e.message || e).includes("已经在错题库")) c.saved = true; PWQ.toast(String(e.message || e), "error"); renderSheet(); return; }
      c.saved = true; c.saving = false;
      PWQ.toast("这道题已保存到云端错题库。");
      renderSheet();
    };
  }
}
document.getElementById("recognize").onclick = async () => {
  let targets = [];
  if (multiMode && photoPages.length) {
    photoPages.forEach((page, pi) => {
      page.boxes.filter(b => b.selected).sort((a,b) => (a.selOrder||0) - (b.selOrder||0)).forEach(box => targets.push({pageIndex: pi, box: box, dataUrl: page.dataUrl}));
    });
  } else {
    targets = boxes.filter(b => b.selected).sort((a,b) => (a.selOrder||0) - (b.selOrder||0)).map(box => ({pageIndex: -1, box: box, dataUrl: null}));
  }
  if (!targets.length) {
    PWQ.toast("请先点方框选至少一道错题。");
    return;
  }
  if (!multiMode && !currentPhotoDataUrl) { PWQ.toast("请先拍照或从相册选一张照片。"); return; }
  // 先打开抽屉占位，显示正在识别，不用假题目冒充真实识别
  sheetCards = targets.map(() => ({ pending: true, failed: false, stem: "", options: [], answer: "", subject: "其他", qkind: "选择题", type: "定性辨析类", explain: "" }));
  sheetIndex = 0;
  renderSheet();
  openSheet("peek");
  PWQ.toast("正在读 " + targets.length + " 道题，读完一道就先显示一道。");
  document.getElementById("ocrNote").textContent = "正在读题…多道题是一起读的，不是排队一道一道等，读完解析面板里会自动出题目和选项。";
  const img = document.getElementById("photo");
  const visionUrl = (window.APP_CONFIG && window.APP_CONFIG.VISION_FUNCTION_URL) || "https://mjsmrltdwcnzmstbjzry.supabase.co/functions/v1/vision";
  const anon = window.APP_CONFIG ? window.APP_CONFIG.SUPABASE_ANON_KEY : "";
  let doneCount = 0;
  const cards = await Promise.all(targets.map(async (target, idx) => { const box = target.box;
    let stem = "", options = [], suggested = "", subject = "其他", qkind = "选择题", explain_type = "定性辨析类";
    try {
      const canvas = document.createElement("canvas");
      let cropImg = img;
      if (target.pageIndex >= 0) {
        cropImg = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = target.dataUrl; });
      }
      const iw = cropImg.naturalWidth, ih = cropImg.naturalHeight;
      const sx = Math.max(0, box.x / 100 * iw), sy = Math.max(0, box.y / 100 * ih);
      const sw = Math.min(iw - sx, box.w / 100 * iw), sh = Math.min(ih - sy, box.h / 100 * ih);
      // 发给模型前先缩小。最长边 1280、JPEG 0.72：印刷题还看得清，上传比 1600/0.85 大约小两倍半。
      const scale = Math.min(1, 1280 / Math.max(sw, sh));
      canvas.width = Math.max(1, Math.round(sw * scale)); canvas.height = Math.max(1, Math.round(sh * scale));
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(cropImg, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      const cropDataUrl = canvas.toDataURL("image/jpeg", 0.72);
      const res = await fetch(visionUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + anon, "apikey": anon },
        body: JSON.stringify({ image: cropDataUrl }),
      });
      let data = {};
      try { data = await res.json(); } catch(e) { data = {}; }
      if (!res.ok || data.error) throw new Error(data.error || data.message || ("识别失败（" + res.status + "）"));
      if (data.usage && PWQ.recordTokenUsage) { PWQ.recordTokenUsage({ model: "deepseek-flash", function_name: "vision", usage: data.usage }).catch(() => {}); }
      stem = PWQ.cleanLatex(data.stem || ""); options = (data.options || []).map(o => PWQ.cleanLatex(o)); suggested = data.suggested_answer || ""; subject = data.subject || "其他"; qkind = data.qkind || "选择题"; explain_type = data.explain_type || "定性辨析类";
      if (subject === "其他" && stem) {
        const latin = (stem.match(/[A-Za-z]/g) || []).length;
        const chinese = (stem.match(/[\u4e00-\u9fa5]/g) || []).length;
        if (latin >= 10 && latin > chinese) subject = "英语";
      }
      if (!String(stem).trim() && !(options || []).filter(o => String(o || "").trim()).length) throw new Error("empty");
    } catch(e) {
      const card = { pending: false, failed: true, stem: "", options: [], answer: "", subject: "其他", qkind: "主观题", type: explain_type, explain: "" };
      sheetCards[idx] = card;
      doneCount++;
      document.getElementById("ocrNote").textContent = "已处理 " + doneCount + " / " + targets.length + " 道…";
      const typing = document.activeElement && document.getElementById("zybBody").contains(document.activeElement);
      if (idx === sheetIndex || !typing) renderSheet();
      return card;
    }
    const card = { pending: false, failed: false, stem, options, answer: suggested, subject, qkind, type: explain_type, explain: "" };
    sheetCards[idx] = card;
    doneCount++;
    document.getElementById("ocrNote").textContent = "已处理 " + doneCount + " / " + targets.length + " 道…";
    const typingOk = document.activeElement && document.getElementById("zybBody").contains(document.activeElement);
    if (idx === sheetIndex || !typingOk) renderSheet();
    return card;
  }));
  sheetCards = cards;
  const typingEnd = document.activeElement && document.getElementById("zybBody").contains(document.activeElement);
  if (!typingEnd) renderSheet();
  openSheet("open");
  const bad = cards.filter(c => c.failed).length;
  if (bad) PWQ.toast("有 " + bad + " 道没读出来，重拍或在下面手动补。", "error");
  else PWQ.toast("识别完成，共 " + cards.length + " 道。题干和选项都能改，再点保存。");
};
document.getElementById("zybRecordBtn").onclick = () => {
  if (sheetCards.length) { renderSheet(); openSheet("open"); return; }
  document.getElementById("recognize").click();
};
document.getElementById("zybClose").onclick = closeSheet;
document.getElementById("zybBackdrop").onclick = closeSheet;
// 抽屉手势：按住顶部抓手上下拖，松手按位置决定收起 / 半展开 / 全展开
(function(){
  const sheet = document.getElementById("zybSheet");
  const grab = document.getElementById("zybGrab");
  let startY = 0, startMode = "open", dragging = false;
  grab.addEventListener("pointerdown", (e) => {
    dragging = true; startY = e.clientY;
    startMode = sheet.classList.contains("peek") ? "peek" : "open";
    sheet.style.transition = "none";
    grab.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  grab.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dy = e.clientY - startY;
    // 只做视觉跟手，不直接改高度：用 translateY 跟手，松手再归位到三个档位
    const base = startMode === "peek" ? 52 : 0;
    const vh = window.innerHeight;
    const offsetVh = base + (dy / vh * 100);
    const clamped = Math.max(0, Math.min(105, offsetVh));
    sheet.style.transform = "translateY(" + clamped + "vh)";
    if (window.innerWidth >= 721) sheet.style.transform = "translateX(-50%) translateY(" + clamped + "vh)";
  });
  const endDrag = (e) => {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = "";
    sheet.style.transform = "";
    const dy = e.clientY - startY;
    if (dy > 120) closeSheet();
    else if (dy > 40) openSheet("peek");
    else openSheet("open");
  };
  grab.addEventListener("pointerup", endDrag);
  grab.addEventListener("pointercancel", endDrag);
})();

// 右滑返回（从屏幕右侧向左滑，Android 手势返回）：先在网站里退一步，不直接退出到浏览器主页。
// 原理：解析面板打开时压一条历史记录，返回先收起面板；面板没开时，上传页返回先回主页；主页再返回才真的退出。
let backSheetOpen = false;
const origOpenSheet = openSheet;
const origCloseSheet = closeSheet;
openSheet = function(mode){
  origOpenSheet(mode);
  if (!backSheetOpen) {
    backSheetOpen = true;
    try { history.pushState({zybSheet: true}, ""); } catch(e) {}
  }
};
closeSheet = function(){
  origCloseSheet();
  if (backSheetOpen) {
    backSheetOpen = false;
    // 如果当前历史就是我们压的那条，返回时不要再触发一次 popstate 循环
    // 这里不主动 history.back，由 popstate 处理；直接关面板即可。
  }
};
window.addEventListener("popstate", () => {
  const sheet = document.getElementById("zybSheet");
  if (sheet && (sheet.classList.contains("open") || sheet.classList.contains("peek"))) {
    backSheetOpen = false;
    origCloseSheet();
    return;
  }
  // 面板没开，上传页右滑返回：先回主页，不直接退出到浏览器主页
  if (location.pathname.endsWith("upload.html") || location.pathname.endsWith("/upload.html")) {
    location.href = "home.html";
  }
});
// 进入上传页时压一条历史，这样第一次右滑返回会先触发 popstate 回主页，而不是直接退出。
try { history.pushState({zybUpload: true}, ""); } catch(e) {}
// 点开这一页就直接是全屏相机，不用再点一次拍照按钮。
startCamera();
window.addEventListener("beforeunload", stopCamera);
</script>
