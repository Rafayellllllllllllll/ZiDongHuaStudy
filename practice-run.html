<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fdf8f0">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>拍照错题本 · 练习答题</title>
<link rel="stylesheet" href="styles.css">
<script src="supabase-js.js" defer onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'"></script>
<script src="config.js" defer></script><script src="app.js" defer></script>
<style>
  /* 题目加选项框起来的底部一行：左下角返回上一题，右下角不确定 */
  .run-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px}
  .run-foot button{margin:0}
  .run-foot .back-btn:disabled{opacity:.45}
  /* 点选项只表示“选中”，用米色，不用绿色。绿色留给答对。 */
  .opt.flash{background:#f7f0dd !important;border-color:#16233a !important;color:#16233a !important}
  .run-foot .self-btns{display:flex;gap:8px;flex-wrap:wrap}
  .run-foot button{min-height:44px}
</style>
</head><body>
<main>
<a class="top-back" href="practice.html" aria-label="返回练习">← 返回</a>
<div class="card" id="runCard"><p>正在加载练习题…</p></div>
</main>
<script>
let pool = [], idx = 0, answers = [];
document.addEventListener("DOMContentLoaded", function () { init(); });
async function init(){
  await PWQ.ready({ questions: true });
  const card = document.getElementById("runCard");
  if (!PWQ.currentUser()) { card.innerHTML = "<p>请先去登录页登录，登录后才能练习云端的题。</p><p><a class='btn' href='practice.html'>回练习页</a></p>"; return; }
  let ids = [];
  try { ids = JSON.parse(sessionStorage.getItem("pwq_practice_ids") || "[]"); } catch(e) { ids = []; }
  if (!ids.length) { card.innerHTML = "<p>没有这次练习的题，请先回练习页选数目、点开始练习。</p><p><a class='btn' href='practice.html'>回练习页</a></p>"; return; }
  const all = PWQ.getQuestions();
  // 按练习页打乱后的顺序出题，找不到的题直接跳过。
  pool = ids.map(id => all.find(q => q.id === id)).filter(Boolean).map(q => {
    q._origStreak = q.streak || 0;
    q._origMastered = !!q.mastered;
    return q;
  });
  if (!pool.length) { card.innerHTML = "<p>这次练习的题找不到了，请回练习页重新开始。</p><p><a class='btn' href='practice.html'>回练习页</a></p>"; return; }
  answers = pool.map(() => null);
  idx = 0;
  show();
}
function show(){
  const q = pool[idx];
  const card = document.getElementById("runCard");
  const prev = answers[idx];
  const usable = (q.options || []).map(o => String(o || "").trim()).filter(o => o.replace(/^[A-D][\.、．:：]\s*/i, "").trim());
  const opts = usable.map((o, oi) => {
    const letter = PWQ.optionLetter(o, oi);
    const sel = prev && prev.chosen === letter ? " selected" : "";
    return "<button class='opt" + sel + "' data-ans='" + letter + "'>" + PWQ.escapeHtml(PWQ.formatOption(o, oi)) + "</button>";
  }).join("");
  const unsureNote = prev && prev.unsure ? "<p class='small'>这道题你上次点了不确定，已算没掌握，重新点选项可以覆盖。</p>" : "";
  const noOptNote = opts ? "" : "<p class='small'>这道题没有选项。点「我会了」算做对，连续三次就标记已经会了；点「不会」会把连续次数清零。</p>";
  const foot = opts
    ? "<div class='run-foot'><button type='button' class='secondary back-btn' id='backBtn'" + (idx === 0 ? " disabled" : "") + ">← 返回上一题</button><button type='button' class='secondary' id='unsureBtn'>不确定</button></div>"
    : "<div class='run-foot'><button type='button' class='secondary back-btn' id='backBtn'" + (idx === 0 ? " disabled" : "") + ">← 返回上一题</button><span class='self-btns'><button type='button' id='knowBtn'>我会了</button><button type='button' class='secondary' id='dontBtn'>不会</button></span></div>";
  card.innerHTML = "<div class='qitem'><p>第 " + (idx+1) + " / " + pool.length + " 题 · " +
    PWQ.escapeHtml(q.subject) + " · " + PWQ.escapeHtml(q.type) + "</p>" +
    "<p><b>" + PWQ.escapeHtml(q.stem) + "</b></p>" +
    opts + unsureNote + noOptNote + foot + "</div>";
  // 点选项：先变绿闪 0.25 秒，再自动下一题，不用再点提交或下一题。
  // 0.25 秒是网上常见的正常速度：小元素反馈一般 200-300 毫秒，Material 的点击波纹也是 200 毫秒左右；
  // 先等一帧把绿色画出来，再等 250 毫秒跳，绿色能看清，又不会拖慢练题节奏（仍在 400 毫秒的流畅感界限内）。
  let advancing = false;
  card.querySelectorAll(".opt").forEach(b => {
    b.onclick = () => {
      if (advancing) return;
      advancing = true;
      card.querySelectorAll(".opt").forEach(x => x.disabled = true);
      b.classList.add("flash");
      answer(idx, b.dataset.ans, false);
      requestAnimationFrame(() => setTimeout(() => { advancing = false; advance(); }, 250));
    };
  });
  document.getElementById("backBtn").onclick = () => {
    if (idx === 0) return;
    idx--;
    show();
  };
  const unsureBtn = document.getElementById("unsureBtn");
  if (unsureBtn) unsureBtn.onclick = () => { answer(idx, "", true); advance(); };
  const knowBtn = document.getElementById("knowBtn");
  const dontBtn = document.getElementById("dontBtn");
  if (knowBtn) knowBtn.onclick = () => { answer(idx, "", false, "know"); advance(); };
  if (dontBtn) dontBtn.onclick = () => { answer(idx, "", false, "dont"); advance(); };
}
async function answer(i, chosen, unsure, selfGrade){
  const q = pool[i];
  let ok = false;
  if (selfGrade === "know") {
    ok = true;
    answers[i] = { chosen: "", unsure: false, ok: true, self: "know" };
  } else if (selfGrade === "dont") {
    answers[i] = { chosen: "", unsure: false, ok: false, self: "dont" };
  } else if (unsure) {
    answers[i] = { chosen: "", unsure: true, ok: false };
  } else {
    ok = PWQ.answerLetter(chosen) === PWQ.answerLetter(q.answer);
    answers[i] = { chosen: chosen, unsure: false, ok: ok };
  }
  // 掌握按练习开始前的连续次数算，返回后重选会覆盖，不会重复累加。
  // 云端保存放后台，不挡自动下一题。
  const target = PWQ.getQuestions().find(x => x.id === q.id);
  if (target) {
    if (!answers[i].ok || answers[i].unsure) { target.streak = 0; target.mastered = false; }
    else { target.streak = (q._origStreak || 0) + 1; target.mastered = target.streak >= 3; }
    PWQ.updateQuestion(target).catch(e => { PWQ.toast(String(e.message || e), "error"); });
  }
}
function advance(){
  idx++;
  if (idx < pool.length) { show(); return; }
  finish();
}
function finish(){
  const card = document.getElementById("runCard");
  const done = answers.filter(Boolean);
  const correct = done.filter(a => a.ok).length;
  const unsure = done.filter(a => a.unsure).length;
  const wrong = done.length - correct - unsure;
  const newly = pool.filter(q => {
    const a = answers[pool.indexOf(q)];
    return a && a.ok && (q._origStreak || 0) + 1 >= 3;
  }).length;
  // 答案等全部练完再一起出：练的时候一题都不出答案，这里按题号列出每道题的正确答案、你选的和解析。
  const list = pool.map((q, i) => {
    const a = answers[i] || { chosen: "", unsure: false, ok: false };
    const usable = (q.options || []).map(o => String(o || "").trim()).filter(o => o.replace(/^[A-D][\.、．:：]\s*/i, "").trim());
    const opts = usable.map((o, oi) => {
      const letter = PWQ.optionLetter(o, oi);
      let cls = "opt";
      let mark = "";
      if (PWQ.answerLetter(letter) === PWQ.answerLetter(q.answer)) { cls += " correct"; mark = "<span class='mark'>正确答案</span>"; }
      else if (!a.unsure && a.chosen === letter) { cls += " wrong"; mark = "<span class='mark'>你选了 ×</span>"; }
      return "<div class='" + cls + "'><span>" + PWQ.escapeHtml(PWQ.formatOption(o, oi)) + "</span>" + mark + "</div>";
    }).join("");
    const your = a.unsure ? "你点了不确定" : (a.self === "know" ? "你点了我会了" : (a.self === "dont" ? "你点了不会" : (a.chosen ? "你选了 " + a.chosen : "你没选")));
    const result = a.unsure ? "不确定，算没掌握" : (a.ok ? "做对了" : "还不会");
    const ref = !usable.length && q.answer ? "参考答案：" + PWQ.escapeHtml(q.answer) + "。" : "";
    return "<div class='qitem'><p>第 " + (i+1) + " 题 · " + PWQ.escapeHtml(q.subject) + " · " + PWQ.escapeHtml(q.type) + "</p>" +
      "<p><b>" + PWQ.escapeHtml(q.stem) + "</b></p>" + opts +
      "<p class='small'>" + your + "，" + result + "。" + ref + "</p>" +
      "<div class='explain'><b>红笔解析：</b>" + PWQ.escapeHtml(q.explain || "这道题还没有解析。") + "</div></div>";
  }).join("");
  card.innerHTML = "<div class='qitem'><h1>这次练习结束了</h1>" +
    "<p>共 " + pool.length + " 题：答对 " + correct + " 道，答错 " + wrong + " 道，不确定 " + unsure + " 道。</p>" +
    (newly ? "<p>其中 " + newly + " 道已连续做对三次，标为已经会了。</p>" : "<p>不确定和答错的题都算没掌握，还会再出现在练习里。</p>") +
    "<p>下面是全部题目的答案，练的时候没有提前出答案。</p>" +
    "<p><a class='btn' href='practice.html'>回练习页</a></p></div>" + list;
  try { sessionStorage.removeItem("pwq_practice_ids"); } catch(e) {}
}
</script>
<nav class="bottomnav"><a href="home.html">主页</a><a href="stats.html">统计</a><a href="index.html?account=1">我的</a></nav>
</body></html>
