<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fdf8f0">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>拍照错题本 · 管理</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="app.js"></script></head><body>
<main>
<div class="card"><h1>管理后台（仅管理员）</h1>
<p>管理员是事先标定的主人账号。能看谁登录、什么时候用；看不到朋友的错题内容。朋友默认普通用户，看不到这一页。</p>
<div id="denied" class="warn hidden">当前账号不是管理员，或未配置管理员账号（config.js 里的 ADMIN_ACCOUNT），所以看不到管理数据。管理员需要在网站上用 Rafayellllllllllllll 注册成功后，由后台标成管理员，才能看到这里。</div>
<div id="ok" class="hidden">
<table><tr><th>账号</th><th>登录时间</th></tr><tbody id="rows"></tbody></table>
<p class="small">登录记录只记账号和登录时间，不记错题内容。注册时不特意向朋友说明管理员能看到这些使用记录（按用户对齐）。</p>
<p><button class="secondary" id="logoutAll">一键退出所有设备</button></p>
</div></div>
</main><footer>云端版 · 管理数据来自 Supabase</footer>
<script>
(async () => {
  await PWQ.ready();
  const u = PWQ.currentUser();
  const ok = PWQ.isAdmin();
  document.getElementById("denied").classList.toggle("hidden", ok);
  document.getElementById("ok").classList.toggle("hidden", !ok);
  if (!ok) return;
  try {
    const { data, error } = await window.supabaseClient.from("login_records").select("username,login_at,last_active_at").order("login_at", { ascending: false }).limit(100);
    if (error) throw error;
    const rows = document.getElementById("rows");
    rows.innerHTML = "";
    if (!data || !data.length) rows.innerHTML = "<tr><td colspan='2'>还没有登录记录。</td></tr>";
    (data || []).forEach(r => {
      const tr = document.createElement("tr");
      const td1 = document.createElement("td"); td1.textContent = r.username || "";
      const td2 = document.createElement("td"); td2.textContent = r.login_at ? new Date(r.login_at).toLocaleString() : "";
      tr.append(td1, td2); rows.appendChild(tr);
    });
  } catch(e) {
    document.getElementById("rows").innerHTML = "<tr><td colspan='2'>读取登录记录失败：" + PWQ.escapeHtml(String(e.message || e)) + "</td></tr>";
  }
})();
document.getElementById("logoutAll").onclick = async () => {
  if (!confirm("退出所有设备后，所有设备都要重新登录，确定吗？")) return;
  await PWQ.signOutAll();
  location.href = "index.html";
};
</script>
<nav class="bottomnav"><a href="home.html">主页</a><a href="stats.html">统计</a><a href="index.html?account=1">我的</a></nav>
</body></html>
