<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小错本">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6fbf8">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>小错本 · 练习</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* 科目胶囊：跟错题库顶部胶囊同尺寸同比例，不再偏大：高 34px、左右 12px、字 13px，一行横向滑动，不换行，不出滚动条 */
  .subj-row{display:flex;gap:8px;overflow-x:auto;flex-wrap:nowrap;padding:0 0 4px;margin:0 0 4px;scrollbar-width:none;-ms-overflow-style:none}
  .subj-row::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;margin:0;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px;line-height:34px;font-weight:700;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .1s ease}
  .chip:active{transform:scale(.96)}
  .chip.selected{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:800}
  .chip.disabled{opacity:.45;cursor:not-allowed}
  .chip.disabled:active{transform:none}
</style>
<script src="supabase-js.js" defer onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'"></script>
<script src="config.js" defer></script><script src="app.js" defer></script></head><body>
<main>
<a class="top-back" href="home.html" aria-label="返回主页">← 返回</a>
<div class="card"><h1>练习</h1>
<div id="subjectArea"><p class="small">正在加载科目…</p></div>
<label>这次练几道？（五的倍数，最多 50）</label>
<select id="count"><option>5</option><option>10</option><option>15</option><option>20</option><option>25</option><option>30</option><option>35</option><option>40</option><option>45</option><option>50</option></select>
<p><button id="start">开始练习</button>
<button class="secondary" id="review">已掌握复查</button></p>
</div>
</main>
<script>
let pool = [], idx = 0;
let availableSubjects = [];
let chipIsAll = true;
let chipSelected = new Set();
async function renderSubjects(){
  await PWQ.ready({ questions: true });
  const area = document.getElementById("subjectArea");
  if (!PWQ.currentUser()) { area.innerHTML = "<p>请先去登录页登录，登录后才能看到错题库的科目。</p>"; return; }
  const all = PWQ.getQuestions();
  // 科目按错题库里出现的顺序，不写死；只显示科目名，不带数量。
  const order = [];
  const unmastered = {};
  all.forEach(q => {
    const s = q.subject || "其他";
    if (!order.includes(s)) order.push(s);
    if (!q.mastered) unmastered[s] = (unmastered[s] || 0) + 1;
  });
  if (!order.length) { area.innerHTML = "<p>错题库里还没有题，先去录错题。</p>"; return; }
  availableSubjects = order.filter(s => (unmastered[s] || 0) > 0);
  chipIsAll = true;
  chipSelected = new Set();
  const chips = order.map(s => {
    const dis = (unmastered[s] || 0) === 0;
    return "<button type='button' class='chip" + (dis ? " disabled" : "") + "' data-subject='" + PWQ.escapeHtml(s) + "'" + (dis ? " disabled" : "") + ">" + PWQ.escapeHtml(s) + "</button>";
  }).join("");
  area.innerHTML = "<div class='subj-row'><button type='button' class='chip selected' data-subject='__all__'>✓ 全部</button>" + chips + "</div>";
  area.querySelectorAll(".chip").forEach(b => {
    b.addEventListener("click", () => {
      if (b.disabled) return;
      const subj = b.dataset.subject;
      if (subj === "__all__") {
        // 点全部：选中全部，单个科目的选中状态取消，视觉上归为全部选中。
        chipIsAll = true;
        chipSelected = new Set();
      } else {
        // 点单个科目：自动取消全部，该科目切换选中/未选中，支持多选。
        chipIsAll = false;
        if (chipSelected.has(subj)) chipSelected.delete(subj); else chipSelected.add(subj);
        // 一个都没选，自动回到全部，保证至少有一个选中项。
        if (!chipSelected.size) { chipIsAll = true; chipSelected = new Set(); }
        // 手动把所有单个科目都选上了，自动变回全部选中。
        else if (availableSubjects.length && availableSubjects.every(s => chipSelected.has(s))) { chipIsAll = true; chipSelected = new Set(); }
      }
      updateChipState();
    });
  });
  updateChipState();
}
function updateChipState(){
  document.querySelectorAll("#subjectArea .chip").forEach(b => {
    const subj = b.dataset.subject;
    let sel = false;
    if (subj === "__all__") sel = chipIsAll;
    else sel = !chipIsAll && chipSelected.has(subj);
    b.classList.toggle("selected", sel);
    // 选中时文字左侧加小对勾，未选中时不加。
    const name = subj === "__all__" ? "全部" : subj;
    b.textContent = (sel ? "✓ " : "") + name;
  });
}
function getSelectedSubjects(){
  if (chipIsAll) return [...availableSubjects];
  return [...chipSelected];
}
async function start(){
  await PWQ.ready({ questions: true });
  if (!PWQ.currentUser()) { PWQ.toast("请先去登录页登录，登录后才能练习云端的题。"); location.href = "index.html"; return; }
  const sel = getSelectedSubjects();
  if (!sel.length) { PWQ.toast("请至少选一个科目。"); return; }
  const all = PWQ.getQuestions().filter(q => !q.mastered && sel.includes(q.subject || "其他"));
  // 随机打乱：不按原来顺序，取用户选的数目；不够就按选中的来。
  const pool = all.sort(() => Math.random() - 0.5)
    .slice(0, parseInt(document.getElementById("count").value, 10));
  // 开始练习一定跳新页面，原页面下面不练题：题号存浏览器里，新页面按这个顺序出题；没题也跳新页面显示，新页面会说明。
  try { sessionStorage.setItem("pwq_practice_ids", JSON.stringify(pool.map(q => q.id))); } catch(e) {}
  location.href = "practice-run.html";
}
document.getElementById("start").onclick = start;
document.addEventListener("DOMContentLoaded", function () { renderSubjects(); });
document.getElementById("review").onclick = () =>
  PWQ.toast("已掌握的题会过一阵子再抽出来复查。这个自动复查还没排上。");
</script>
<nav class="tabbar" data-tab="practice"></nav>
</body></html>
