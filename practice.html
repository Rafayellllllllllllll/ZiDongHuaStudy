<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fdf8f0">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>拍照错题本 · 练习</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="app.js"></script></head><body>
<main>
<div class="card"><h1>练习</h1>
<p>练习前自选数目，都是五的倍数、最多 50 个。从未掌握的题里随机出题，已经会了的题练习里不再出现。点开始练习会跳到新页面，一页一题，点选项自动下一题。</p>
<label>这次练几道？（五的倍数，最多 50）</label>
<select id="count"><option>5</option><option>10</option><option>15</option><option>20</option><option>25</option><option>30</option><option>35</option><option>40</option><option>45</option><option>50</option></select>
<p><button id="start">开始练习</button>
<button class="secondary" id="review">已掌握复查（隔一段时间抽查，骨架占位）</button></p>
<p class="small">如果剩下未掌握的题不够你选的数，就按剩下的来。已经会了的题隔一段时间再抽查，抽查错了回到未掌握；按知识点生成同类题以后由 DeepSeek 生成，骨架里是占位按钮。</p>
<div id="area"></div></div>
</main><footer>云端版 · 练习计数存在 Supabase</footer>
<script>
let pool = [], idx = 0;
async function start(){
  await PWQ.ready();
  if (!PWQ.currentUser()) { document.getElementById("area").innerHTML = "<p>请先去登录页登录，登录后才能练习云端的题。</p>"; return; }
  const all = PWQ.getQuestions().filter(q => !q.mastered);
  // 随机打乱：不按原来顺序，取用户选的数目。
  const pool = all.sort(() => Math.random() - 0.5)
    .slice(0, parseInt(document.getElementById("count").value, 10));
  if (!pool.length) { document.getElementById("area").innerHTML = "<p>没有未掌握的题了，可以去错题库看看，或等已掌握复查。</p>"; return; }
  // 跳转到新页面做题：一页一题，题号顺序存在浏览器里，新页面按这个顺序出题。
  try { sessionStorage.setItem("pwq_practice_ids", JSON.stringify(pool.map(q => q.id))); } catch(e) {}
  location.href = "practice-run.html";
}
document.getElementById("start").onclick = start;
document.getElementById("review").onclick = () =>
  PWQ.toast("占位：已掌握复查应隔一段时间（例如一两周，具体天数待定）再随机抽查，抽查错了回到未掌握。当前骨架不自动排期。");
</script>
<nav class="bottomnav"><a href="home.html">主页</a><a href="stats.html">统计</a><a href="index.html?account=1">我的</a></nav>
</body></html>
