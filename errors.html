<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拍照错题本 · 易错题</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="app.js"></script><script src="decorations.js"></script></head><body>
<header><div class="logo">拍照<span>错题本</span></div></header>
<main>
<div class="card"><h1>易错题</h1>
<p>错题库里点星星收藏的、特别薄弱、容易错的题都在这里，和笔记本并列、互不干扰。</p>
<div id="list"></div></div>
</main><footer>云端版</footer>
<script>
(async () => {
await PWQ.ready();
if (!PWQ.currentUser()) { document.getElementById("list").innerHTML = "<p>请先去登录页登录。</p>"; return; }
const qs = PWQ.getQuestions().filter(q => q.starred);
const list = document.getElementById("list");
if (!qs.length) list.innerHTML = "<p>还没收藏。去错题库点星星，特别薄弱的题就会到这里。</p>";
qs.forEach(q => {
  const d = document.createElement("div");
  d.className = "qitem";
  d.innerHTML = "<p><span class='tag'>" + PWQ.escapeHtml(q.subject) + "</span>" +
    (q.qkind ? "<span class='tag'>" + PWQ.escapeHtml(q.qkind) + "</span>" : "") + "</p>" +
    "<p><b>" + PWQ.escapeHtml(q.stem) + "</b></p>" +
    "<p>" + PWQ.escapeHtml(q.explain) + "</p>";
  list.appendChild(d);
});
})();
</script>

</body></html>
