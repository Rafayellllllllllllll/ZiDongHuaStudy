<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拍照错题本 · 笔记本</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="app.js"></script></head><body>
<main>
<div class="card"><h1>笔记本</h1>
<p>新开的一页，自己粘贴知识点，和难题、易错题都没关系。默认黑色，标记重点时再改成红或蓝，每条可以不一样。</p>
<form id="f"><label>粘贴一条知识点</label><textarea id="text" rows="3" required placeholder="粘贴知识点，例如：先乘除后加减。"></textarea>
<label>颜色</label><select id="color"><option value="black">黑色（默认）</option><option value="red">红色</option><option value="blue">蓝色</option></select>
<button type="submit">加一条</button></form>
<div id="list"></div></div>
</main><footer>云端版 · 笔记本存在 Supabase</footer>
<script>
async function render(){
  await PWQ.ready();
  if (!PWQ.currentUser()) { document.getElementById("list").innerHTML = "<p>请先去登录页登录，登录后笔记本才能存到云端。</p>"; return; }
  const notes = PWQ.getNotes(); const list = document.getElementById("list"); list.innerHTML = "";
  if (!notes.length) list.innerHTML = "<p>还没有知识点，上面粘贴一条试试。</p>";
  notes.forEach((n) => {
    const d = document.createElement("div"); d.className = "qitem";
    const sel = document.createElement("select");
    [["black","黑色"],["red","红色"],["blue","蓝色"]].forEach(([v, label]) => {
      const o = document.createElement("option"); o.value = v; o.textContent = label; if (n.color === v) o.selected = true; sel.appendChild(o);
    });
    sel.onchange = async () => { try { await PWQ.updateNote(n.id, sel.value); } catch(e) { PWQ.toast(String(e.message || e)); } render(); };
    const pp = document.createElement("p"); pp.textContent = n.text; pp.style.color = n.color || "black";
    const del = document.createElement("button"); del.className = "ghost"; del.textContent = "删除";
    del.onclick = async () => { await PWQ.deleteNote(n.id); render(); };
    d.append(pp, sel, del); list.appendChild(d);
  });
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  await PWQ.ready();
  if (!PWQ.currentUser()) { PWQ.toast("请先登录。"); location.href = "index.html"; return; }
  try {
    await PWQ.addNote(document.getElementById("text").value.trim(), document.getElementById("color").value);
    document.getElementById("text").value = ""; render();
  } catch(err) { PWQ.toast(String(err.message || err)); }
});
render();
</script>
<nav class="bottomnav"><a href="home.html">🏠<br>主页</a><a href="bank.html">📊<br>统计</a><a href="index.html?account=1">👤<br>我的</a></nav>
</body></html>
