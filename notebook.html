<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fdf8f0">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>笔记</title>
<script src="supabase-js.js" defer onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'"></script>
<script src="config.js" defer></script>
<script src="app.js" defer></script>
<style>
  :root{
    --bg:#fdf8f0; --surface:#ffffff; --toolbar-bg:#f7f0dd; --text:#16233a; --muted:#6b7280; --line:#e9e0cf; --accent:#d92d20; --accent-soft:#fdecea; --disabled:#c9bfae;
  }
  html[data-theme="dark"]{
    --bg:#141a26; --surface:#1e2636; --toolbar-bg:#232c40; --text:#eef1f6; --muted:#9aa5b8; --line:#2e3850; --accent:#ff7a6b; --accent-soft:#3a2325; --disabled:#5a6378;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);height:100dvh;transition:background-color .2s ease,color .2s ease}
  .view{max-width:720px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
  .view[hidden]{display:none !important}
  /* 列表页：顶部标题和搜索框固定 */
  .list-header{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line)}
  .list-title-row{display:flex;align-items:center;gap:8px;margin:0 0 12px}
  .list-header h1{font-size:24px;margin:0;display:flex;justify-content:space-between;align-items:baseline;flex:1;min-width:0}
  .top-back{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:700;font-size:14px;text-decoration:none;flex:0 0 auto}
  .save-error{color:#d92d20;font-size:13px;margin:8px 0 0;line-height:1.5}
  .list-header h1 span{font-size:14px;color:var(--muted);font-weight:400}
  .search-input{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--text);font-size:15px;outline:0}
  .select-bar{display:flex;gap:8px;align-items:center;margin-top:12px}
  .select-bar[hidden]{display:none}
  .select-bar span{flex:1;font-size:14px;color:var(--muted)}
  .select-bar button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:14px;font-weight:700;cursor:pointer}
  .select-bar button.danger{background:var(--accent);border-color:var(--accent);color:#fff}
  .note-list{flex:1;overflow-y:auto;padding:12px 16px 110px}
  .note-card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;cursor:pointer;transition:transform .15s ease,background-color .15s ease}
  .note-card:active{transform:scale(.98)}
  .note-card.selected{border-color:var(--accent)}
  .note-card-inner{display:flex;gap:12px;padding:14px 16px;transition:transform .2s ease;background:var(--surface)}
  .note-card.swiped .note-card-inner{transform:translateX(-80px)}
  .note-card-text{flex:1;min-width:0}
  .note-title{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 0 6px}
  .note-summary{font-size:14px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 8px}
  .note-time{font-size:12px;color:var(--muted)}
  .note-thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:0 0 auto}
  .note-delete-swipe{position:absolute;right:0;top:0;bottom:0;width:80px;background:#d92d20;color:#fff;border:0;font-size:15px;font-weight:700;display:none;cursor:pointer}
  .note-card.swiped .note-delete-swipe{display:block}
  .empty-state,.no-result{text-align:center;color:var(--muted);padding:40px 20px;line-height:1.6}
  .empty-state[hidden],.no-result[hidden]{display:none}
  .fab{position:fixed;right:20px;bottom:88px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;font-size:28px;border:0;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:20;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .fab:active{transform:scale(.94)}
  /* 编辑页单行顶部栏：高约 52-56px（不含安全区），背景和页面一致，底部淡分割线 */
  .topbar-single{position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:2px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--bg);border-bottom:1px solid var(--line)}
  .top-left,.top-tools,.top-right{display:flex;align-items:center;gap:2px}
  .top-tools{flex:1;justify-content:flex-start;min-width:0}
  .top-sep{width:1px;height:24px;background:var(--line);flex:0 0 auto;margin:0 4px}
  .icon-btn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:transparent;color:var(--text);cursor:pointer;transition:background-color .15s ease,transform .1s ease;flex:0 0 auto}
  .icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .icon-btn:active{transform:scale(.94);background:var(--accent-soft)}
  .icon-btn:disabled{color:var(--disabled);cursor:not-allowed}
  .icon-btn:disabled:active{transform:none;background:transparent}
  .icon-btn.accent{color:var(--accent)}
  .icon-btn .theme-sun{display:none}
  html[data-theme="dark"] .icon-btn .theme-moon{display:none}
  html[data-theme="dark"] .icon-btn .theme-sun{display:block}
  .icon-btn .format-t{font-size:20px;font-weight:700;line-height:1;font-family:Georgia,serif}
  #moreBtn{display:none}
  .more-menu{position:absolute;top:calc(100% + 4px);right:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:30;display:flex;flex-direction:column;gap:4px}
  .more-menu[hidden]{display:none}
  .more-menu button{padding:10px 16px;text-align:left;background:transparent;border:0;color:var(--text);font-size:15px;cursor:pointer}
  @media (max-width:380px){
    .topbar-single{padding-left:8px;padding-right:8px;gap:2px}
    #themeBtn{display:none}
    #moreBtn{display:inline-flex}
  }
  /* T 点开的格式栏：平时不显示，点 T 后在顶部栏下方临时展开，两行紧凑：第一行 4 个颜色圆点，第二行加粗/下划线 */
  .format-bar{flex:0 0 auto;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
  .format-bar[hidden]{display:none}
  .format-colors{display:flex;gap:14px;flex-wrap:nowrap;align-items:center}
  .color-dot{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;padding:0;background:var(--dot-color);transition:box-shadow .15s ease,transform .1s ease;flex:0 0 auto}
  .color-dot:active{transform:scale(.94)}
  .color-dot.selected{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--dot-color)}
  .format-btns{display:flex;gap:8px;flex-wrap:wrap}
  .format-btns button{padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--text);font-size:14px;font-weight:700;cursor:pointer;transition:background-color .15s ease,color .15s ease,border-color .15s ease}
  .format-btns button.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .title-area{flex:0 0 auto;padding:4px 20px 12px;background:var(--bg)}
  .title-input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:26px;font-weight:700;line-height:1.3;padding:0}
  .title-input::placeholder{color:var(--muted);font-weight:600}
  .meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}
  .meta .sep{width:1px;height:12px;background:var(--line)}
  .editor-area{flex:1 1 auto;min-height:0;overflow-y:auto;padding:4px 20px 20px;background:var(--bg)}
  .body-input{width:100%;min-height:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:17px;line-height:1.75;caret-color:var(--accent);white-space:pre-wrap;word-break:break-word}
  .body-input:empty::before{content:attr(data-placeholder);color:var(--muted);pointer-events:none}
  .body-input::selection{background:var(--accent-soft)}
  .body-input img{max-width:100%;height:auto;border-radius:12px;display:block;margin:8px 0}
  /* 待办：第 5 步。方框是 20px 方块，打勾后整行变灰加删除线，方框里的勾用 CSS 画，不占字数。 */
  .todo-item{display:flex;align-items:flex-start;gap:8px;margin:4px 0;line-height:1.75}
  .todo-box{flex:0 0 auto;width:20px;height:20px;margin-top:4px;border:2px solid var(--text);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none}
  .todo-item.checked .todo-box::after{content:"\2713";font-size:15px;font-weight:800;line-height:1}
  .todo-text{flex:1;min-width:0;outline:0}
  .todo-item.checked .todo-text{color:var(--muted);text-decoration:line-through}
  .todo-item.checked .todo-text *{color:var(--muted) !important}
  .body-input [data-color="black"]{color:#000}
  .body-input [data-color="red"]{color:#d92d20}
  .body-input [data-color="blue"]{color:#2563eb}
  .body-input [data-color="green"]{color:#2e7d32}
  html[data-theme="dark"] .body-input [data-color="black"]{color:#eef1f6}
  html[data-theme="dark"] .body-input [data-color="red"]{color:#ff7a6b}
  html[data-theme="dark"] .body-input [data-color="blue"]{color:#7aa5ff}
  html[data-theme="dark"] .body-input [data-color="green"]{color:#66bb6a}
</style>
</head>
<body>
<!-- 列表页（首页） -->
<div id="listView" class="view">
  <header class="list-header">
    <div class="list-title-row"><a class="top-back" href="home.html" aria-label="返回主页">← 返回</a><h1>笔记 <span id="noteCount"></span></h1></div>
    <input id="searchInput" class="search-input" type="search" placeholder="搜索标题和正文" aria-label="搜索笔记">
    <div id="selectBar" class="select-bar" hidden>
      <span id="selectCount"></span>
      <button type="button" class="danger" id="deleteSelectedBtn">删除</button>
      <button type="button" id="cancelSelectBtn">取消</button>
    </div>
  </header>
  <main id="noteList" class="note-list"></main>
  <div id="emptyState" class="empty-state" hidden>还没有笔记，点右下角＋开始记录</div>
  <div id="noResult" class="no-result" hidden>没有找到相关笔记</div>
  <button type="button" id="newNoteBtn" class="fab" aria-label="新建笔记">＋</button>
</div>

<!-- 编辑页 -->
<div id="editorView" class="view" hidden>
  <header class="topbar-single">
    <div class="top-left">
      <button class="icon-btn" type="button" id="backBtn" aria-label="返回" title="返回"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    </div>
    <div class="top-tools">
      <button class="icon-btn" type="button" id="imageBtn" aria-label="插入图片" title="插入图片"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-4 4-3-3-4 4"/></svg></button>
      <button class="icon-btn" type="button" id="todoBtn" aria-label="待办清单" title="待办清单"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg></button>
      <button class="icon-btn" type="button" id="formatBtn" aria-label="文字格式" title="文字格式"><span class="format-t">T</span></button>
    </div>
    <div class="top-sep" aria-hidden="true"></div>
    <div class="top-right">
      <button class="icon-btn" type="button" id="undoBtn" aria-label="撤销" title="撤销" disabled><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="icon-btn" type="button" id="redoBtn" aria-label="重做" title="重做" disabled><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      <button class="icon-btn accent" type="button" id="completeBtn" aria-label="完成" title="完成并保存"><svg viewBox="0 0 24 24"><path d="M5 12l4 4L19 6"/></svg></button>
      <button class="icon-btn" type="button" id="themeBtn" aria-label="切换浅色深色模式" title="切换浅色 / 深色"><svg class="theme-moon" viewBox="0 0 24 24"><path d="M20 13A8 8 0 0 1 11 4a8 8 0 1 0 9 9z"/></svg><svg class="theme-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M18.4 18.4l-1.4-1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg></button>
      <button class="icon-btn" type="button" id="moreBtn" aria-label="更多" title="更多">⋯</button>
      <div id="moreMenu" class="more-menu" hidden><button type="button" id="themeMenuBtn">切换浅色 / 深色</button></div>
    </div>
  </header>
  <div id="formatBar" class="format-bar" hidden>
    <div class="format-colors" id="formatColors"></div>
    <div class="format-btns">
      <button type="button" id="boldBtn" title="加粗"><b>加粗</b></button>
      <button type="button" id="underlineBtn" title="下划线"><u>下划线</u></button>
    </div>
  </div>
  <input type="file" id="imageFileInput" accept="image/*" style="display:none" aria-label="选择图片">
  <section class="title-area">
    <input class="title-input" type="text" placeholder="标题" aria-label="标题" id="titleInput">
    <div class="meta"><span id="dateText">10月28日 上午11:27</span><span class="sep" aria-hidden="true"></span><span id="wordCount">0字</span></div>
  </section>
  <main class="editor-area"><div class="body-input" contenteditable="true" data-placeholder="开始书写..." aria-label="正文" id="bodyInput"></div></main>
</div>

<script>
  // 主题：读上次选择，没有就跟随系统；切换后记住。
  (function(){
    var root = document.documentElement;
    function toggleTheme(){
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('note-theme', next); } catch(e) {}
    }
    var saved = null;
    try { saved = localStorage.getItem('note-theme'); } catch(e) {}
    if (saved === 'dark' || saved === 'light') root.setAttribute('data-theme', saved);
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) root.setAttribute('data-theme', 'dark');
    document.getElementById('themeBtn').addEventListener('click', toggleTheme);
    document.getElementById('themeMenuBtn').addEventListener('click', function(){ toggleTheme(); document.getElementById('moreMenu').hidden = true; });
    document.getElementById('moreBtn').addEventListener('click', function(e){ e.stopPropagation(); var m = document.getElementById('moreMenu'); m.hidden = !m.hidden; });
    document.addEventListener('click', function(e){
      var m = document.getElementById('moreMenu');
      if (!m.hidden && !e.target.closest('#moreMenu') && !e.target.closest('#moreBtn')) m.hidden = true;
    });
  })();

  // 编辑页基础输入：实时字数、日期时间、占位提示（第2步逻辑，保持不变）。
  var titleInput = document.getElementById('titleInput');
  var bodyInput = document.getElementById('bodyInput');
  var dateText = document.getElementById('dateText');
  var wordCount = document.getElementById('wordCount');
  function formatDateTime(date){
    var month = date.getMonth() + 1, day = date.getDate(), hour = date.getHours();
    var period = hour < 12 ? '上午' : '下午';
    var hour12 = hour % 12; if (hour12 === 0) hour12 = 12;
    return month + '月' + day + '日 ' + period + hour12 + ':' + String(date.getMinutes()).padStart(2, '0');
  }
  function updateDateTime(){ dateText.textContent = formatDateTime(new Date()); }
  updateDateTime(); setInterval(updateDateTime, 30000);
  function getBodyPlainText(){
    var parts = [];
    function walk(node){
      if (node.nodeType === 3) { parts.push(node.textContent); return; }
      if (node.nodeName === 'BR') { parts.push('\n'); return; }
      if (node.nodeName === 'IMG') return;
      var isBlock = ['DIV','P','LI'].indexOf(node.nodeName) >= 0;
      for (var i = 0; i < node.childNodes.length; i++) walk(node.childNodes[i]);
      if (isBlock) parts.push('\n');
    }
    for (var i = 0; i < bodyInput.childNodes.length; i++) walk(bodyInput.childNodes[i]);
    return parts.join('').replace(/\n+$/, '');
  }
  function getBodyImages(){ return Array.prototype.map.call(bodyInput.querySelectorAll('img'), function(img){ return img.src; }).slice(0, 5); }
  function updateWordCount(){ wordCount.textContent = getBodyPlainText().replace(/\s/g, '').length + '字'; }
  var editorDirty = false;
  bodyInput.addEventListener('input', function(){
    // 空了就清成真正的空，让占位提示重新出现；图片不计字数。
    if (!getBodyPlainText().trim() && !bodyInput.querySelector('img')) { /* 不在这里清，避免打断光标；占位用 :empty 处理，空行时浏览器会留 <br>，下次打开时仍按空处理 */ }
    normalizeBodyColors();
    updateWordCount();
    editorDirty = true;
    updateUndoRedoButtons();
  });

  // 格式栏（精简版）：第一行 4 个颜色圆点，第二行加粗/下划线两个开关。
  // 正文区是富文本编辑区（原来是纯文本输入框，纯文本做不到一段文字一个颜色、一段加粗一段不加粗，
  // 所以底层换成了富文本，外观、字号、行距、占位、字数统计逻辑保持不变）。
  // 颜色和样式各自独立，可以叠加：红色+加粗、蓝色+下划线都可以；切换颜色不影响加粗/下划线开关，反过来也一样。
  var FORMAT_COLORS = [
    { name: 'black', hex: '#000000', label: '黑色' },
    { name: 'red', hex: '#d92d20', label: '红色' },
    { name: 'blue', hex: '#2563eb', label: '蓝色' },
    { name: 'green', hex: '#2e7d32', label: '绿色' }
  ];
  var savedRange = null;
  function saveSelection(){
    try {
      var sel = window.getSelection();
      if (sel.rangeCount && bodyInput.contains(sel.getRangeAt(0).commonAncestorContainer)) savedRange = sel.getRangeAt(0).cloneRange();
    } catch(e) {}
  }
  function restoreSelection(){
    try {
      if (savedRange) {
        var sel = window.getSelection();
        sel.removeAllRanges(); sel.addRange(savedRange);
      }
    } catch(e) {}
  }
  function rgbToColorName(rgb){
    if (!rgb) return null;
    var m = String(rgb).replace(/\s/g, '').match(/rgb\((\d+),(\d+),(\d+)\)/);
    if (!m) return null;
    var r = +m[1], g = +m[2], b = +m[3];
    if (r < 40 && g < 40 && b < 40) return 'black';
    if (r > 180 && g < 100 && b < 100) return 'red';
    if (r < 100 && g < 140 && b > 180) return 'blue';
    if (r < 100 && g > 90 && b < 100) return 'green';
    if (r === 22 && g === 35 && b === 58) return 'black';
    if (r === 238 && g === 241 && b === 246) return 'black';
    return null;
  }
  function normalizeBodyColors(){
    // 把浏览器插进来的行内颜色转成 data-color，换深色模式时黑色不会黑底看不见，红/蓝/绿在深色下也会提亮。
    var els = bodyInput.querySelectorAll('[style*="color"], font[color]');
    els.forEach(function(el){
      var c = el.style && el.style.color ? el.style.color : el.getAttribute('color');
      var name = rgbToColorName(c) || (c && c.indexOf('#') === 0 ? ({'#000000':'black','#d92d20':'red','#2563eb':'blue','#2e7d32':'green'})[c.toLowerCase()] : null);
      if (name) { el.setAttribute('data-color', name); if (el.style) el.style.color = ''; el.removeAttribute('color'); }
    });
  }
  function syncFormatBar(){
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount || !bodyInput.contains(sel.getRangeAt(0).commonAncestorContainer)) return;
    var node = sel.getRangeAt(0).startContainer;
    var el = node.nodeType === 3 ? node.parentElement : node;
    var colorName = 'black', bold = false, underline = false;
    while (el && el !== bodyInput) {
      if (!colorName || colorName === 'black') { if (el.getAttribute && el.getAttribute('data-color')) colorName = el.getAttribute('data-color'); }
      if (el.nodeName === 'B' || el.nodeName === 'STRONG') bold = true;
      if (el.nodeName === 'U') underline = true;
      var st = el.style || {};
      if (st.fontWeight && parseInt(st.fontWeight, 10) >= 700) bold = true;
      if (st.textDecoration && st.textDecoration.indexOf('underline') >= 0) underline = true;
      el = el.parentElement;
    }
    if (colorName === 'black' || !colorName) {
      try {
        var q = document.queryCommandValue('foreColor');
        var mapped = rgbToColorName(q);
        if (mapped) colorName = mapped;
      } catch(e) {}
    }
    try { if (document.queryCommandState('bold')) bold = true; } catch(e) {}
    try { if (document.queryCommandState('underline')) underline = true; } catch(e) {}
    document.querySelectorAll('#formatColors .color-dot').forEach(function(d){ d.classList.toggle('selected', d.dataset.color === colorName); });
    document.getElementById('boldBtn').classList.toggle('active', bold);
    document.getElementById('underlineBtn').classList.toggle('active', underline);
  }
  function applyFormat(kind, value){
    bodyInput.focus();
    restoreSelection();
    try { document.execCommand('styleWithCSS', false, true); } catch(e) {}
    if (kind === 'color') {
      try { document.execCommand('foreColor', false, value); } catch(e) {}
      normalizeBodyColors();
      document.querySelectorAll('#formatColors .color-dot').forEach(function(d){ d.classList.toggle('selected', d.dataset.color === value); });
    } else if (kind === 'bold') {
      try { document.execCommand('bold', false, null); } catch(e) {}
    } else if (kind === 'underline') {
      try { document.execCommand('underline', false, null); } catch(e) {}
    }
    editorDirty = true;
    updateUndoRedoButtons();
    setTimeout(syncFormatBar, 0);
  }
  (function(){
    var btn = document.getElementById('formatBtn');
    var bar = document.getElementById('formatBar');
    document.getElementById('formatColors').innerHTML = FORMAT_COLORS.map(function(c){
      return "<button type='button' class='color-dot" + (c.name === 'black' ? ' selected' : '') + "' style='--dot-color:" + c.hex + ";background:" + c.hex + "' data-color='" + c.name + "' data-hex='" + c.hex + "' title='" + c.label + "' aria-label='" + c.label + "'></button>";
    }).join('');
    document.querySelectorAll('#formatColors .color-dot').forEach(function(d){
      d.addEventListener('mousedown', function(e){ e.preventDefault(); });
      d.addEventListener('click', function(e){
        e.stopPropagation();
        var name = d.dataset.color, hex = d.dataset.hex;
        applyFormat('color', name === 'black' ? '#000000' : hex);
        // 颜色名要对应到 data-color：黑色用 #000000，红/蓝/绿用各自 hex，normalize 后会转成名字。
        // 直接把当前点的选中态先定下来，光标同步随后还会再校一次。
        document.querySelectorAll('#formatColors .color-dot').forEach(function(x){ x.classList.toggle('selected', x === d); });
      });
    });
    document.getElementById('boldBtn').addEventListener('mousedown', function(e){ e.preventDefault(); });
    document.getElementById('boldBtn').addEventListener('click', function(e){ e.stopPropagation(); applyFormat('bold'); });
    document.getElementById('underlineBtn').addEventListener('mousedown', function(e){ e.preventDefault(); });
    document.getElementById('underlineBtn').addEventListener('click', function(e){ e.stopPropagation(); applyFormat('underline'); });
    btn.addEventListener('click', function(e){ e.stopPropagation(); bar.hidden = !bar.hidden; if (!bar.hidden) syncFormatBar(); });
    document.addEventListener('click', function(e){
      if (!bar.hidden && !e.target.closest('#formatBar') && !e.target.closest('#formatBtn')) bar.hidden = true;
    });
    document.addEventListener('selectionchange', function(){ if (!document.getElementById('editorView').hidden) { saveSelection(); syncFormatBar(); } });
    bodyInput.addEventListener('keyup', syncFormatBar);
    bodyInput.addEventListener('click', syncFormatBar);
    bodyInput.addEventListener('blur', saveSelection);
  })();

  // 撤销/重做：用编辑区自带的撤销栈，所以颜色和样式的改变也能撤销；按钮平时置灰，编辑后可用，撤销后重做可用。
  function updateUndoRedoButtons(){
    var u = document.getElementById('undoBtn'), r = document.getElementById('redoBtn');
    if (u) u.disabled = !editorDirty && !u.dataset.everEdited;
    if (r) r.disabled = true;
    if (u && u.dataset.everEdited) u.disabled = false;
  }
  document.getElementById('undoBtn').addEventListener('click', function(){
    bodyInput.focus();
    try { document.execCommand('undo'); } catch(e) {}
    document.getElementById('redoBtn').disabled = false;
    updateWordCount(); setTimeout(syncFormatBar, 0);
  });
  document.getElementById('redoBtn').addEventListener('click', function(){
    bodyInput.focus();
    try { document.execCommand('redo'); } catch(e) {}
    updateWordCount(); setTimeout(syncFormatBar, 0);
  });
  // 输入后把撤销按钮点亮（用 dataset 记一次编辑，避免每次 input 都重置重做状态）。
  bodyInput.addEventListener('input', function(){ document.getElementById('undoBtn').dataset.everEdited = '1'; document.getElementById('undoBtn').disabled = false; document.getElementById('redoBtn').disabled = true; });

  // 待办：第 5 步。点顶部待办按钮，把当前行变成待办项；再点一次变回普通行。
  // 点方框打勾/取消，打勾后整行变灰加删除线；回车开下一条待办，空待办回车退出清单变回普通行。
  function getCurrentBlock(){
    try {
      var sel = window.getSelection();
      if (!sel.rangeCount) return null;
      var node = sel.getRangeAt(0).startContainer;
      while (node && node.parentNode !== bodyInput && node !== bodyInput) node = node.parentNode;
      return node === bodyInput ? null : node;
    } catch(e) { return null; }
  }
  function createTodoItem(html){
    var item = document.createElement('div');
    item.className = 'todo-item';
    var box = document.createElement('span');
    box.className = 'todo-box';
    box.setAttribute('contenteditable', 'false');
    var text = document.createElement('span');
    text.className = 'todo-text';
    text.innerHTML = html || '';
    item.appendChild(box); item.appendChild(text);
    return item;
  }
  function placeCaretIn(el, atEnd){
    try {
      var sel = window.getSelection(); var range = document.createRange();
      if (atEnd) { range.selectNodeContents(el); range.collapse(false); }
      else { range.setStart(el, 0); range.collapse(true); }
      sel.removeAllRanges(); sel.addRange(range);
    } catch(e) {}
  }
  function convertTodoToNormal(item){
    var textEl = item.querySelector('.todo-text');
    var div = document.createElement('div');
    div.innerHTML = textEl ? textEl.innerHTML : '';
    if (!div.innerHTML) div.innerHTML = '<br>';
    item.replaceWith(div);
    placeCaretIn(div, true);
    return div;
  }
  function toggleTodo(){
    bodyInput.focus(); restoreSelection();
    var block = getCurrentBlock();
    if (block && block.classList && block.classList.contains('todo-item')) {
      convertTodoToNormal(block);
    } else if (block && block.nodeType === 3) {
      var item = createTodoItem(escapeHtml(block.textContent));
      block.replaceWith(item);
      placeCaretIn(item.querySelector('.todo-text'), true);
    } else if (block) {
      var item = createTodoItem(block.innerHTML);
      block.replaceWith(item);
      placeCaretIn(item.querySelector('.todo-text'), true);
    } else {
      var item2 = createTodoItem('');
      bodyInput.appendChild(item2);
      placeCaretIn(item2.querySelector('.todo-text'), false);
    }
    editorDirty = true;
    document.getElementById('undoBtn').dataset.everEdited = '1'; document.getElementById('undoBtn').disabled = false;
    updateWordCount(); scheduleDraft();
  }
  document.getElementById('todoBtn').addEventListener('mousedown', function(e){ e.preventDefault(); });
  document.getElementById('todoBtn').addEventListener('click', function(e){ e.stopPropagation(); toggleTodo(); });
  // 点方框打勾/取消：方框本身不可编辑，点它不移动光标，只切换状态并保存。
  bodyInput.addEventListener('mousedown', function(e){
    if (e.target.closest && e.target.closest('.todo-box')) e.preventDefault();
  });
  bodyInput.addEventListener('click', function(e){
    var box = e.target.closest ? e.target.closest('.todo-box') : null;
    if (!box) return;
    e.preventDefault(); e.stopPropagation();
    var item = box.closest('.todo-item');
    if (!item) return;
    var checked = item.classList.toggle('checked');
    item.dataset.checked = checked ? 'true' : 'false';
    editorDirty = true;
    document.getElementById('undoBtn').dataset.everEdited = '1'; document.getElementById('undoBtn').disabled = false;
    scheduleDraft();
  });
  // 回车：在待办里回车开下一条，空待办回车退出清单。
  bodyInput.addEventListener('keydown', function(e){
    if (e.key !== 'Enter') return;
    var sel = window.getSelection();
    if (!sel.rangeCount) return;
    var node = sel.getRangeAt(0).startContainer;
    var item = null, el = node.nodeType === 3 ? node.parentElement : node;
    while (el && el !== bodyInput) { if (el.classList && el.classList.contains('todo-item')) { item = el; break; } el = el.parentElement; }
    if (!item) return;
    e.preventDefault();
    var textEl = item.querySelector('.todo-text');
    var text = textEl ? textEl.textContent.trim() : '';
    if (!text) {
      convertTodoToNormal(item);
    } else {
      var next = createTodoItem('');
      item.after(next);
      placeCaretIn(next.querySelector('.todo-text'), false);
    }
    editorDirty = true;
    document.getElementById('undoBtn').dataset.everEdited = '1'; document.getElementById('undoBtn').disabled = false;
    updateWordCount();
    bodyInput.dispatchEvent(new Event('input', {bubbles: true}));
    scheduleDraft();
  });

  // 插入图片：点小图标直接打开相册，选图后插到光标处；最多 5 张，超了不插并提示；大图先压到最长边 800 再存，避免本地存储爆掉。
  (function(){
    var btn = document.getElementById('imageBtn');
    var input = document.getElementById('imageFileInput');
    btn.addEventListener('click', function(){
      saveSelection();
      input.click();
    });
    input.addEventListener('change', function(){
      var file = input.files && input.files[0];
      input.value = '';
      if (!file) return;
      if (getBodyImages().length >= 5) { alert('最多只能插入 5 张图片'); return; }
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = async function(){
          var maxW = 800, w = img.width, h = img.height;
          if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
          var canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          var url = canvas.toDataURL('image/jpeg', 0.85);
          var path = '';
          var src = '';
          try {
            if (!window.PWQ || !PWQ.uploadNoteImage) throw new Error('页面还没准备好，请稍后再插图片。');
            path = await PWQ.uploadNoteImage(url);
            src = await PWQ.signedUrlForNoteImage(path);
          } catch (err) {
            if (window.PWQ && PWQ.toast) PWQ.toast(String(err.message || err), 'error');
            else alert(String(err.message || err));
            return;
          }
          bodyInput.focus(); restoreSelection();
          var imgEl = document.createElement('img'); imgEl.src = src; imgEl.alt = '';
          if (path) imgEl.dataset.path = path;
          var sel = window.getSelection();
          if (sel.rangeCount && bodyInput.contains(sel.getRangeAt(0).commonAncestorContainer)) {
            var range = sel.getRangeAt(0); range.deleteContents(); range.insertNode(imgEl);
            var br = document.createElement('br'); imgEl.after(br);
            range.setStartAfter(br); range.collapse(true); sel.removeAllRanges(); sel.addRange(range);
          } else {
            bodyInput.appendChild(imgEl); bodyInput.appendChild(document.createElement('br'));
          }
          editorDirty = true;
          document.getElementById('undoBtn').dataset.everEdited = '1'; document.getElementById('undoBtn').disabled = false;
          updateWordCount(); scheduleDraft();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  })();

  // 笔记按登录账号存在云端。本机旧笔记会在第一次打开时合并进去。保存失败会红字提示，不再悄悄丢掉。
  var notesMem = [];
  var currentNoteId = null, origTitle = '', origBody = '', origBodyHtml = '', origNote = null, draftTimer = null;
  var selecting = false, selectedIds = new Set(), longPressTimer = null, longPressed = false;
  var lastSaveMsg = '';
  function loadNotes(){ return notesMem; }
  function reportSave(msg){
    if (!msg || msg === lastSaveMsg) return;
    lastSaveMsg = msg;
    if (window.PWQ && PWQ.toast) PWQ.toast(msg, 'error');
    else alert(msg);
  }
  function htmlForStorage(root){
    var clone = root.cloneNode(true);
    clone.querySelectorAll('img').forEach(function(img){
      if (img.getAttribute('data-path')) img.setAttribute('src', 'storage://note-images/' + img.getAttribute('data-path'));
    });
    return clone.innerHTML;
  }
  function hasEditorContent(){
    return !!(titleInput.value.trim() || getBodyPlainText().trim() || bodyInput.querySelector('img'));
  }
  function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':"&quot;","'":"&#39;"}[c]; }); }
  function formatNoteTime(ts){
    var d = new Date(ts), now = new Date();
    var period = d.getHours() < 12 ? '上午' : '下午';
    var h12 = d.getHours() % 12; if (h12 === 0) h12 = 12;
    var mm = String(d.getMinutes()).padStart(2, '0');
    if (d.toDateString() === now.toDateString()) return period + h12 + ':' + mm;
    if (d.getFullYear() === now.getFullYear()) return (d.getMonth() + 1) + '月' + d.getDate() + '日';
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }
  function showView(name){
    document.getElementById('listView').hidden = name !== 'list';
    document.getElementById('editorView').hidden = name !== 'editor';
    if (name === 'list') renderList();
  }
  function renderList(){
    var q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
    var notes = loadNotes().slice().sort(function(a,b){ return (b.updatedAt || 0) - (a.updatedAt || 0); });
    document.getElementById('noteCount').textContent = notes.length ? '共 ' + notes.length + ' 条' : '';
    var filtered = q ? notes.filter(function(n){ return (n.title || '').toLowerCase().includes(q) || (n.body || '').toLowerCase().includes(q); }) : notes;
    var listEl = document.getElementById('noteList');
    document.getElementById('emptyState').hidden = !(notes.length === 0 && !q);
    document.getElementById('noResult').hidden = !(q && filtered.length === 0);
    listEl.innerHTML = '';
    filtered.forEach(function(n){
      var title = (n.title || '').trim();
      var firstLine = (n.body || '').split('\n').find(function(l){ return l.trim(); }) || '';
      var showTitle = title || firstLine.trim() || '无标题';
      var card = document.createElement('div');
      card.className = 'note-card' + (selectedIds.has(n.id) ? ' selected' : '');
      card.dataset.id = n.id;
      var thumbSrc = n.thumbUrl || '';
      if (!thumbSrc && n.images && n.images.length && String(n.images[0]).indexOf('data:') === 0) thumbSrc = n.images[0];
      if (!thumbSrc && n.bodyHtml) { var m = String(n.bodyHtml).match(/<img[^>]+src=["'](data:image\/[^"']+)["']/); if (m) thumbSrc = m[1]; }
      var thumb = thumbSrc ? "<img class='note-thumb' src='" + escapeHtml(thumbSrc) + "' alt=''>" : '';
      card.innerHTML = "<div class='note-card-inner'><div class='note-card-text'><p class='note-title'>" + escapeHtml(showTitle) + "</p><p class='note-summary'>" + escapeHtml(n.body || '') + "</p><p class='note-time'>" + escapeHtml(formatNoteTime(n.updatedAt || n.createdAt || Date.now())) + "</p></div>" + thumb + "</div><button type='button' class='note-delete-swipe' aria-label='删除这条笔记'>删除</button>";
      // 点击整张卡：选择模式下切换选中，否则打开编辑页。
      card.addEventListener('click', function(e){
        if (e.target.closest('.note-delete-swipe')) return;
        if (longPressed) { longPressed = false; return; }
        if (selecting) { toggleSelect(n.id, card); return; }
        openEditor(n.id);
      });
      // 长按进选择模式。
      card.addEventListener('pointerdown', function(e){
        if (e.target.closest('.note-delete-swipe')) return;
        longPressed = false;
        clearTimeout(longPressTimer);
        longPressTimer = setTimeout(function(){ longPressed = true; enterSelectMode(n.id); }, 600);
      });
      card.addEventListener('pointerup', function(){ clearTimeout(longPressTimer); });
      card.addEventListener('pointerleave', function(){ clearTimeout(longPressTimer); });
      // 左滑露出删除。
      var startX = 0, startY = 0;
      card.addEventListener('pointerdown', function(e){ startX = e.clientX; startY = e.clientY; });
      card.addEventListener('pointermove', function(e){
        var dx = e.clientX - startX, dy = e.clientY - startY;
        if (dx < -50 && Math.abs(dx) > Math.abs(dy)) {
          document.querySelectorAll('.note-card.swiped').forEach(function(c){ if (c !== card) c.classList.remove('swiped'); });
          card.classList.add('swiped');
        }
      });
      card.querySelector('.note-delete-swipe').addEventListener('click', async function(e){
        e.stopPropagation();
        if (!confirm('确定删除 1 条笔记吗？')) return;
        try {
          await PWQ.deleteNote(n.id);
          notesMem = PWQ.getNotes();
          renderList();
        } catch (err) { reportSave('删除失败：' + String(err.message || err)); }
      });
      listEl.appendChild(card);
    });
    updateSelectBar();
  }
  function updateSelectBar(){
    var bar = document.getElementById('selectBar');
    bar.hidden = !selecting;
    document.getElementById('selectCount').textContent = selecting ? '已选 ' + selectedIds.size + ' 条' : '';
  }
  function enterSelectMode(id){
    selecting = true;
    selectedIds.add(id);
    renderList();
  }
  function toggleSelect(id, card){
    if (selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
    if (card) card.classList.toggle('selected', selectedIds.has(id));
    if (!selectedIds.size) { selecting = false; }
    updateSelectBar();
    if (!selecting) renderList();
  }
  document.getElementById('cancelSelectBtn').addEventListener('click', function(){ selecting = false; selectedIds.clear(); renderList(); });
  document.getElementById('deleteSelectedBtn').addEventListener('click', async function(){
    if (!selectedIds.size) return;
    if (confirm('确定删除 ' + selectedIds.size + ' 条笔记吗？')) {
      var ids = Array.from(selectedIds);
      for (var di = 0; di < ids.length; di++) {
        try { await PWQ.deleteNote(ids[di]); }
        catch (err) { reportSave('删除失败：' + String(err.message || err)); }
      }
      notesMem = PWQ.getNotes();
      selecting = false; selectedIds.clear(); renderList();
    }
  });
  document.getElementById('searchInput').addEventListener('input', renderList);
  document.getElementById('newNoteBtn').addEventListener('click', function(){ openEditor(null); });

  function plainToHtml(text){
    return String(text || '').split('\n').map(function(l){ return escapeHtml(l); }).join('<br>');
  }
  async function openEditor(id){
    var notes = loadNotes();
    var note = id ? notes.find(function(n){ return n.id === id; }) : null;
    currentNoteId = note ? note.id : null;
    var bodyHtml = note ? (note.bodyHtml || plainToHtml(note.body || '')) : '';
    var bodyPlain = note ? (note.body || '') : '';
    origNote = note ? { id: note.id, title: note.title || '', body: bodyPlain, bodyHtml: bodyHtml, createdAt: note.createdAt, updatedAt: note.updatedAt, images: note.images || [] } : null;
    origTitle = note ? (note.title || '') : '';
    origBody = bodyPlain;
    origBodyHtml = bodyHtml;
    titleInput.value = origTitle;
    var shownHtml = bodyHtml;
    if (window.PWQ && PWQ.prepareNoteHtml) {
      try { shownHtml = await PWQ.prepareNoteHtml(bodyHtml); } catch (e) {}
    }
    bodyInput.innerHTML = shownHtml;
    savedRange = null;
    editorDirty = false;
    var u = document.getElementById('undoBtn'), r = document.getElementById('redoBtn');
    if (u) { u.disabled = true; delete u.dataset.everEdited; }
    if (r) r.disabled = true;
    document.querySelectorAll('#formatColors .color-dot').forEach(function(d){ d.classList.toggle('selected', d.dataset.color === 'black'); });
    document.getElementById('boldBtn').classList.remove('active');
    document.getElementById('underlineBtn').classList.remove('active');
    updateWordCount(); updateDateTime();
    document.getElementById('formatBar').hidden = true;
    selecting = false; selectedIds.clear();
    showView('editor');
    try { titleInput.focus({preventScroll: true}); } catch(e) { try { titleInput.focus(); } catch(e2) {} }
  }
  async function upsertCurrentNote(){
    var title = titleInput.value, body = getBodyPlainText(), bodyHtml = htmlForStorage(bodyInput);
    if (!hasEditorContent()) return { empty: true };
    try {
      var res = await PWQ.saveFullNote({
        id: currentNoteId,
        title: title,
        body: body,
        bodyHtml: bodyHtml,
        createdAt: origNote ? origNote.createdAt : Date.now(),
        updatedAt: Date.now()
      });
      if (res.warning) reportSave(res.warning);
      else lastSaveMsg = '';
      currentNoteId = res.note.id;
      notesMem = PWQ.getNotes();
      return { ok: true, note: res.note };
    } catch (err) {
      reportSave('保存失败：' + String(err.message || err));
      return { ok: false };
    }
  }
  // 草稿自动保存：对应当前这条笔记，同一个 ID 更新，不在列表里产生重复项。
  function scheduleDraft(){
    clearTimeout(draftTimer);
    draftTimer = setTimeout(function(){
      if (!hasEditorContent()) return;
      upsertCurrentNote();
    }, 3000);
  }
  titleInput.addEventListener('input', scheduleDraft);
  bodyInput.addEventListener('input', scheduleDraft);
  document.getElementById('completeBtn').addEventListener('click', async function(){
    if (!hasEditorContent()) { showView('list'); return; }
    var res = await upsertCurrentNote();
    if (res && res.ok) showView('list');
  });
  document.getElementById('backBtn').addEventListener('click', async function(){
    var changed = editorDirty || titleInput.value !== origTitle || getBodyPlainText() !== origBody;
    if (!changed) { showView('list'); return; }
    if (confirm('内容有修改，是否保存？')) {
      if (hasEditorContent()) {
        var res = await upsertCurrentNote();
        if (!res || !res.ok) return;
      }
    } else if (origNote && origNote.id) {
      try {
        await PWQ.saveFullNote(origNote);
        notesMem = PWQ.getNotes();
      } catch (err) { reportSave('没能恢复原来的笔记：' + String(err.message || err)); }
    } else if (currentNoteId) {
      try {
        await PWQ.deleteNote(currentNoteId);
        notesMem = PWQ.getNotes();
      } catch (err) { reportSave('没能丢掉未保存的草稿：' + String(err.message || err)); }
    }
    showView('list');
  });
  async function bootNotes(){
    if (!window.PWQ) { renderList(); return; }
    try { await PWQ.ready({ notes: true }); }
    catch (err) { reportSave('笔记加载失败：' + String(err.message || err)); }
    notesMem = PWQ.getNotes();
    if (!PWQ.currentUser()) {
      var hint = document.createElement('p');
      hint.className = 'save-error';
      hint.textContent = '还没登录，笔记只在这台手机上。登录后会按账号同步到云端。';
      document.querySelector('.list-header').appendChild(hint);
    }
    renderList();
    document.addEventListener('pwq-notes', function(){
      if (!document.getElementById('editorView').hidden) return;
      notesMem = PWQ.getNotes();
      renderList();
    });
  }
  document.addEventListener('DOMContentLoaded', function(){ bootNotes(); });
</script>
</body>
