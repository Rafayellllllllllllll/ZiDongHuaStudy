</main>
<nav class="bottomnav">

<a href="index.html?account=1">我的</a>
</nav>
<script>
document.addEventListener("DOMContentLoaded", function () {
(async () => {
  await PWQ.ready({ questions: true });
  const u = PWQ.currentUser();
  if (!u) { location.href = "index.html"; return; }
  const av = document.getElementById("avatar");
  if (u.avatar_url) { av.innerHTML = ""; const im = document.createElement("img"); im.src = u.avatar_url; im.alt = ""; av.appendChild(im); }
  else av.textContent = (u.username || "我").slice(0, 1);
  function paint(){
    const qs = PWQ.getQuestions();
    const today = PWQ.todayShanghai();
    const todayCount = qs.filter(q => q.created_at && PWQ.dateInShanghai(q.created_at) === today).length;
    const mastered = qs.filter(q => q.mastered).length;
    document.getElementById("stats").textContent = "今天：已记录 " + todayCount + " 题 · 错题库共 " + qs.length + " 题 · 已掌握 " + mastered + " 题（点进错题库看统计）";
  }
  paint();
  document.addEventListener("pwq-questions", paint);
})();
});
</script></body></html>
