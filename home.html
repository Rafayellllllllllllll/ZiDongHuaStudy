<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拍照错题本 · 主页</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="app.js"></script>
</head><body>
<header class="home-head"><div class="logo">拍照<span>错题本</span></div>
<div id="avatar" class="avatar" title="点开账号菜单">我</div></header>
<div id="menu" class="avatar-menu hidden">
<p id="who" class="small"></p>
<p><a href="index.html?account=1">我的账号 / 退出</a></p>
<p id="adminLink" class="hidden"><a href="admin.html">管理后台（仅管理员）</a></p>
<p><button class="secondary" id="logoutBtn">退出登录</button></p>
</div>
<main>
<a class="btn big-photo" href="upload.html">📷 拍照搜改题</a>
<div class="grid2">
<a href="practice.html"><span class="ic">✏️</span><span>练习<small>从未掌握里随机出题</small></span></a>
<a href="bank.html"><span class="ic">📚</span><span>错题本<small>全部错题，按学科分</small></span></a>
<a href="errors.html"><span class="ic">⭐</span><span>易错题<small>星标收藏的薄弱题</small></span></a>
<a href="notebook.html"><span class="ic">📓</span><span>笔记本<small>自己粘贴知识点</small></span></a>
</div>
<a class="statsbar" href="bank.html" id="stats">今天：正在加载…</a>
<p class="small">登录后这个主页就是主页面，登录页不会再出现，除非你主动退出。功能入口都在上面这四个方块和拍照按钮里，不再挤在最上面一排。</p>
</main>
<nav class="bottomnav">
<a href="home.html" class="active">🏠<br>主页</a>
<a href="bank.html">📊<br>统计</a>
<a href="index.html?account=1">👤<br>我的</a>
</nav>
<script>
(async () => {
  await PWQ.ready();
  const u = PWQ.currentUser();
  if (!u) { location.href = "index.html"; return; }
  document.getElementById("who").textContent = "当前账号：" + u.username + (u.role === "admin" ? "（管理员）" : "");
  document.getElementById("avatar").textContent = (u.username || "我").slice(0, 1);
  if (PWQ.isAdmin()) document.getElementById("adminLink").classList.remove("hidden");
  const qs = PWQ.getQuestions();
  const today = new Date().toISOString().slice(0, 10);
  // created_at 是云端时间戳，本地日期按 ISO 日期粗算，今天题数以题库里今天创建的为准，旧题没有 created_at 时不计。
  const todayCount = qs.filter(q => q.created_at && String(q.created_at).slice(0, 10) === today).length;
  const mastered = qs.filter(q => q.mastered).length;
  document.getElementById("stats").textContent = "今天：已记录 " + todayCount + " 题 · 错题库共 " + qs.length + " 题 · 已掌握 " + mastered + " 题（点进错题库看统计）";
})();
document.getElementById("avatar").onclick = () => {
  document.getElementById("menu").classList.toggle("hidden");
};
document.getElementById("logoutBtn").onclick = async () => {
  await PWQ.signOut();
  location.href = "index.html";
};
</script></body></html>
