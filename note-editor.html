<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>笔记 · 第1步：界面布局</title>
<!--
  笔记编辑页 · 第1步：只搭界面和布局
  技术：原生 HTML + CSS + JS，单文件，不用构建，直接用浏览器打开就能看。
  这一步只做外观，暂不实现功能：
  - 标题、正文可以像普通输入框一样打字（浏览器自带），但字数、日期、撤销/重做、保存、待办、格式、图片都还没有接线；
  - 唯一能点的功能是右上角的浅色/深色切换，那是第1步要验的主题部分。
  第2步已做：标题/正文输入、实时字数、日期时间、占位提示、打开自动聚焦；键盘上移沿用第1步修订的 visualViewport。
  已确认的修订（第1步补做）：
  - 配色跟错题本网站一致，不再纯黑纯白；
  - 底部工具栏平时在页面最下面一行，键盘弹出时跟随键盘上移，贴在键盘上面一行（见下面 visualViewport 代码）；
  已确认的后续需求（不跳步）：
  - 第7步做：选图片时最多选 5 张，点单个已插入的图片可以裁剪/调大小。
  - 第6步做（用户 2026-10-28 已选定）：点 T 后展开的面板里既有颜色，又有加粗这些格式——上面一排颜色，选中的文字改颜色；下面是加粗、斜体、下划线、大/中/小标题、无序列表、有序列表。
  结构拆分（按注释找）：
  1. 顶部操作栏  2. 标题区  3. 正文编辑区  4. 底部工具栏
-->
<style>
  /* ========== 主题色（跟错题本网站保持一致，不再纯黑纯白） ==========
     网站原色：暖米白底 #fdf8f0，藏青文字 #16233a，主按钮红 #d92d20，
     标签浅米 #f7f0dd，细米色边 #e9e0cf。笔记页直接用同一套，放在网站里不突兀。
     浅色：暖米白底 + 藏青文字 + 红色强调色（完成对勾、光标、主题按钮）；
     深色：不是纯黑，是同一藏青加深后的深藏青底，强调色提亮成浅红，深色下也看得清。 */
  :root{
    --bg:#fdf8f0;
    --surface:#ffffff;
    --toolbar-bg:#f7f0dd;
    --text:#16233a;
    --muted:#6b7280;
    --line:#e9e0cf;
    --accent:#d92d20;
    --accent-soft:#fdecea;
    --disabled:#c9bfae;
  }
  html[data-theme="dark"]{
    --bg:#141a26;
    --surface:#1e2636;
    --toolbar-bg:#232c40;
    --text:#eef1f6;
    --muted:#9aa5b8;
    --line:#2e3850;
    --accent:#ff7a6b;
    --accent-soft:#3a2325;
    --disabled:#5a6378;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100dvh;
    height:var(--viewport-height, 100dvh);
    /* 主题切换时颜色平滑过渡，不要太花哨 */
    transition:background-color .2s ease,color .2s ease;
  }
  /* 页面整体：上下固定、中间滚动。用 flex 列布局实现，
     顶部栏和底部栏高度固定，正文区 flex:1 + overflow:auto，内容多时只滚中间。 */
  .page{
    max-width:720px;
    height:100dvh;
    height:var(--viewport-height, 100dvh);
    margin:0 auto;
    display:flex;
    flex-direction:column;
    background:var(--bg);
  }

  /* ========== 1. 顶部操作栏 ========== */
  .topbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:calc(10px + env(safe-area-inset-top)) 8px 10px;
    background:var(--bg);
  }
  .topbar-left,.topbar-right{display:flex;align-items:center;gap:4px}
  /* 所有图标按钮统一：不小于 44x44，方便手指点 */
  .icon-btn{
    width:44px;height:44px;
    display:inline-flex;align-items:center;justify-content:center;
    border:0;border-radius:12px;
    background:transparent;color:var(--text);
    cursor:pointer;
    transition:background-color .15s ease,transform .1s ease;
  }
  .icon-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .icon-btn:active{transform:scale(.94);background:var(--accent-soft)}
  .icon-btn:disabled{color:var(--disabled);cursor:not-allowed}
  .icon-btn:disabled:active{transform:none;background:transparent}
  .icon-btn.accent{color:var(--accent)}
  .icon-btn .theme-sun{display:none}
  html[data-theme="dark"] .icon-btn .theme-moon{display:none}
  html[data-theme="dark"] .icon-btn .theme-sun{display:block}

  /* ========== 2. 标题区 ========== */
  .title-area{flex:0 0 auto;padding:4px 20px 12px;background:var(--bg)}
  .title-input{
    width:100%;
    border:0;outline:0;background:transparent;
    color:var(--text);
    font-size:26px;font-weight:700;line-height:1.3;
    padding:0;
  }
  .title-input::placeholder{color:var(--muted);font-weight:600}
  /* 信息行：日期时间 + 细竖线 + 字数，小号灰色 */
  .meta{
    display:flex;align-items:center;gap:8px;
    margin-top:8px;
    font-size:13px;color:var(--muted);
  }
  .meta .sep{width:1px;height:12px;background:var(--line)}

  /* ========== 3. 正文编辑区 ========== */
  .editor-area{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    padding:4px 20px 20px;
    background:var(--bg);
  }
  .body-input{
    width:100%;height:100%;
    border:0;outline:0;resize:none;
    background:transparent;
    color:var(--text);
    font-size:17px;line-height:1.75;
    caret-color:var(--accent);
  }
  .body-input::placeholder{color:var(--muted)}
  /* 文字选择手柄/选区也用强调色（浏览器支持的部分） */
  .body-input::selection{background:var(--accent-soft)}

  /* ========== 4. 底部工具栏 ========== */
  .toolbar{
    flex:0 0 auto;
    display:flex;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    background:var(--toolbar-bg);
    border-top:1px solid var(--line);
  }
  /* 3 个按钮等距排列 */
  .toolbar .icon-btn{flex:1}
  .toolbar .icon-btn svg{width:26px;height:26px}
  /* 文字格式按钮里的 T 是文字不是线条图标，单独定样式 */
  .toolbar .format-t{font-size:22px;font-weight:700;line-height:1;font-family:Georgia,serif}
</style>
</head>
<body>
<div class="page">
  <!-- 1. 顶部操作栏：左侧返回，右侧撤销、重做、完成；最右边是第1步验主题用的浅色/深色切换 -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" type="button" aria-label="返回" title="返回（第1步暂未接功能）">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>
    <div class="topbar-right">
      <!-- 第1步：撤销/重做按规范显示为置灰、不可点击 -->
      <button class="icon-btn" type="button" aria-label="撤销" title="撤销（第1步暂未接功能）" disabled>
        <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      </button>
      <button class="icon-btn" type="button" aria-label="重做" title="重做（第1步暂未接功能）" disabled>
        <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
      </button>
      <button class="icon-btn accent" type="button" aria-label="完成" title="完成（第1步暂未接功能）">
        <svg viewBox="0 0 24 24"><path d="M5 12l4 4L19 6"/></svg>
      </button>
      <!-- 主题切换：第1步唯一接了功能的按钮，点一下切换浅色/深色 -->
      <button class="icon-btn" type="button" id="themeBtn" aria-label="切换浅色深色模式" title="切换浅色 / 深色">
        <svg class="theme-moon" viewBox="0 0 24 24"><path d="M20 13A8 8 0 0 1 11 4a8 8 0 1 0 9 9z"/></svg>
        <svg class="theme-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M18.4 18.4l-1.4-1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
      </button>
    </div>
  </header>

  <!-- 2. 标题区：单行大字标题 + 日期时间 | 字数的信息行（第1步是布局示例，第2步才接实时数据） -->
  <section class="title-area">
    <input class="title-input" type="text" placeholder="标题" aria-label="标题" id="titleInput" autofocus>
    <div class="meta">
      <span id="dateText">10月28日 上午11:27</span>
      <span class="sep" aria-hidden="true"></span>
      <span id="wordCount">0字</span>
    </div>
  </section>

  <!-- 3. 正文编辑区：多行输入，占据主要空间，内容多时这里滚动，顶部和底部不动 -->
  <main class="editor-area">
    <textarea class="body-input" placeholder="开始书写..." aria-label="正文" id="bodyInput"></textarea>
  </main>

  <!-- 4. 底部工具栏：插入图片、待办清单、文字格式，等距排列（第1步只做外观和按压反馈） -->
  <footer class="toolbar">
    <button class="icon-btn" type="button" aria-label="插入图片" title="插入图片（第1步暂未接功能）">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-4 4-3-3-4 4"/></svg>
    </button>
    <button class="icon-btn" type="button" aria-label="待办清单" title="待办清单（第1步暂未接功能）">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>
    </button>
    <button class="icon-btn" type="button" aria-label="文字格式" title="文字格式（第1步暂未接功能）">
      <span class="format-t">T</span>
    </button>
  </footer>
</div>

<script>
  // 第1步唯一的功能：浅色 / 深色切换。
  // 优先读上次的选择，没有就跟随系统；切换后记住选择，下次打开还是这个模式。
  (function(){
    var root = document.documentElement;
    var btn = document.getElementById('themeBtn');
    var saved = null;
    try { saved = localStorage.getItem('note-theme'); } catch(e) {}
    if (saved === 'dark' || saved === 'light') {
      root.setAttribute('data-theme', saved);
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      root.setAttribute('data-theme', 'dark');
    }
    btn.addEventListener('click', function(){
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('note-theme', next); } catch(e) {}
    });
  })();
  // 底部工具栏跟随键盘：平时工具栏在页面最下面一行（flex 底部栏）；
  // 键盘弹出时，手机浏览器会把可视区域压小，visualViewport.height 就是键盘上面那一行的高度。
  // 把页面高度改成这个高度，工具栏就会跟着上移、贴在键盘上面一行，而不是被键盘盖住、也不会蹦到页面顶部。
  // 没有 visualViewport 的旧浏览器就保持原来的 100dvh，不会坏。
  (function(){
    function updateViewport(){
      if (window.visualViewport) {
        document.documentElement.style.setProperty('--viewport-height', window.visualViewport.height + 'px');
      }
    }
    updateViewport();
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', updateViewport);
      window.visualViewport.addEventListener('scroll', updateViewport);
    }
    window.addEventListener('resize', updateViewport);
  })();
  // 注意：第1步到此为止。返回、撤销、重做、完成、图片、待办、格式这几个按钮
  // 在这一步故意没有接点击逻辑，第2步起按顺序接。
</script>

<script>
  // 第2步：基础输入功能（只做这一层，撤销/重做、保存、待办、格式、图片还是后面几步）。
  (function(){
    var titleInput = document.getElementById('titleInput');
    var bodyInput = document.getElementById('bodyInput');
    var dateText = document.getElementById('dateText');
    var wordCount = document.getElementById('wordCount');
    if (!titleInput || !bodyInput || !dateText || !wordCount) return;

    // 日期时间：格式如“10月28日 上午11:27”，12小时制，上午是 0-11 点，下午是 12-23 点。
    // 打开时显示一次，之后每 30 秒刷新一次，跨过整点/分钟时不用刷新页面也会变。
    function formatDateTime(date){
      var month = date.getMonth() + 1;
      var day = date.getDate();
      var hour = date.getHours();
      var period = hour < 12 ? '上午' : '下午';
      var hour12 = hour % 12;
      if (hour12 === 0) hour12 = 12;
      var minute = String(date.getMinutes()).padStart(2, '0');
      return month + '月' + day + '日 ' + period + hour12 + ':' + minute;
    }
    function updateDateTime(){ dateText.textContent = formatDateTime(new Date()); }
    updateDateTime();
    setInterval(updateDateTime, 30000);

    // 实时字数：只计正文字数，空格和换行不计（中文里一个字就是一个字，标点计入）。
    // 标题不计入这里。打字、删字、粘贴都会触发 input，字数立刻变。
    function updateWordCount(){
      var text = bodyInput.value.replace(/\s/g, '');
      wordCount.textContent = text.length + '字';
    }
    bodyInput.addEventListener('input', updateWordCount);
    updateWordCount();

    // 占位提示：标题和正文都用浏览器原生的 placeholder，
    // 空白时显示“标题”/“开始书写...”，一开始输入就自动消失，删空后又回来，不用自己写逻辑。

    // 打开自动聚焦标题：打开页面就把光标放到标题框，安卓上一般会直接弹键盘。
    // 苹果手机上有时会拦住自动弹键盘，那是系统限制，这时点一下标题框就能弹键盘。
    // 键盘弹出时工具栏上移：已经在第1步修订里用 visualViewport 做了，这里不重复做，
    // 只要页面高度跟着可视区域变，工具栏就会贴在键盘上面一行。
    try { titleInput.focus({preventScroll: true}); } catch(e) { titleInput.focus(); }
  })();
</script>
</body>
</html>
