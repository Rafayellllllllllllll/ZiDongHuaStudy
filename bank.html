<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拍照错题本 · 错题库</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="app.js"></script></head><body>
<main>
<div class="card"><h1>错题库</h1>
<p class="small">点进去首先是全部，从上到下按时间从近到远排，不分科目，全部都能在全部那一栏看到。想看某个学科，就点最上方的小胶囊。</p>
<p><button type="button" class="secondary" id="dedupBtn">一键清理重复题</button> <span class="small" id="dedupInfo"></span></p>
<div id="pills"></div>
<div id="list"></div>
<p><button class="secondary" onclick="window.print()">导出打印（浏览器打印）</button>
<a class="btn ghost" href="practice.html">去练习</a></p>
<p class="small">数据在云端，换设备登录同一个账号也能看到。删除后统计也会同步更新。</p></div>
</main><footer>云端版 · 数据存在 Supabase</footer>
<script>
const SUBJECTS = ["全部","语文","数学","英语","物理","化学","生物","政治","历史","地理","计算机","其他"];
let allQs = [];
let currentSubject = "全部";
let eyeState = {};
function normStem(s){ return String(s || "").replace(/\s+/g, "").replace(/[，。、；：？！,.!?;:\\(\)\[\]{}]/g, ""); }
function sortNewToOld(qs){
  return [...qs].sort((a,b) => {
    const ta = a.created_at ? new Date(a.created_at).getTime() : 0;
    const tb = b.created_at ? new Date(b.created_at).getTime() : 0;
    return tb - ta;
  });
}
function renderPills(){
  const el = document.getElementById("pills");
  el.innerHTML = SUBJECTS.map(s => "<button type='button' class='bank-pill" + (s === currentSubject ? " active" : "") + "' data-s='" + s + "'>" + s + "</button>").join("");
  el.querySelectorAll(".bank-pill").forEach(btn => {
    btn.onclick = () => { currentSubject = btn.dataset.s; render(); };
  });
}
function optionExplain(q, letter){
  // 定性辨析类：每个选项后面跟一个选项解析；定量类：只显示整体解析，不逐选项拆。
  // 选项解析来源：优先用 explain 里按 A/B/C/D 分段的内容，没有分段时用整体解析兜底，绝不编造新解析。
  const text = q.explain || "";
  const parts = {};
  const re = /([A-D])[\.、．：:]\s*([^A-D]+?)(?=(?:[A-D])[\.、．：:]|$)/g;
  let m;
  while ((m = re.exec(text)) !== null) { parts[m[1]] = m[2].trim(); }
  if (parts[letter]) return parts[letter];
  return "";
}
async function render(){
  await PWQ.ready();
  if (!PWQ.currentUser()) { document.getElementById("list").innerHTML = "<p>请先去登录页登录，登录后这里才会显示你在云端的错题。</p>"; return; }
  allQs = sortNewToOld(PWQ.getQuestions());
  renderPills();
  const list = document.getElementById("list");
  list.innerHTML = "";
  const filtered = currentSubject === "全部" ? allQs : allQs.filter(q => (q.subject || "其他") === currentSubject);
  if (!filtered.length) {
    list.innerHTML = "<p>这里还没有" + (currentSubject === "全部" ? "" : currentSubject + "的") + "错题。先去录错题。</p>";
    return;
  }
  filtered.forEach(q => {
    const d = document.createElement("div");
    d.className = "qitem" + (q.mastered ? " mastered" : "");
    const isQual = q.type === "定性辨析类";
    const optsHtml = q.options.map(o => {
      const letter = o.trim().charAt(0);
      const isAns = letter === q.answer;
      const exp = isQual ? optionExplain(q, letter) : "";
      const eyeId = q.id + "_" + letter;
      const shown = !!eyeState[eyeId];
      return "<div class='opt " + (isAns ? "correct" : "") + "'><span>" + PWQ.escapeHtml(o) + "</span>" + (isAns ? "<span class='mark'>正确答案</span>" : "") + "</div>" +
        (isQual ? "<div class='opt-explain'><span class='opt-q'>选项解析：</span><span class='opt-a " + (shown ? "" : "hidden") + "' data-exp='" + eyeId + "'>" + PWQ.escapeHtml(exp || q.explain || "") + "</span><button type='button' class='eye-btn' data-eye='" + eyeId + "' title='点一下显示，再点一下隐藏'>" + (shown ? "<svg width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z'/><circle cx='12' cy='12' r='3'/></svg>" : "<svg width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z'/><circle cx='12' cy='12' r='3'/></svg>") + "</button></div>" : "");
    }).join("");
    d.innerHTML =
      "<button type='button' class='star-btn " + (q.starred ? "on" : "") + "' title='点亮收藏到易错题，再点取消'>★</button>" +
      "<p style='padding-right:28px'><span class='tag'>" + PWQ.escapeHtml(q.subject || "其他") + "</span>" +
      (q.qkind ? "<span class='tag'>" + PWQ.escapeHtml(q.qkind) + "</span>" : "") +
      "<span class='tag'>" + PWQ.escapeHtml(q.type || "") + "</span>" +
      (q.mastered ? "<span class='tag'>已经会了</span>" : "") +
      (q.edited ? "<span class='tag'>手动改过</span>" : "") + "</p>" +
      "<p><b>" + PWQ.escapeHtml(q.stem) + "</b></p>" +
      optsHtml +
      "<p>正确答案：" + PWQ.escapeHtml(q.answer) + "</p>" +
      (isQual ? "" : "<p>解析：" + PWQ.escapeHtml(q.explain) + "</p>");
    // 星星：点亮收藏到易错题，再点取消，星星特别小（22px，见 CSS）
    d.querySelector(".star-btn").onclick = async () => {
      q.starred = !q.starred;
      try { await PWQ.updateQuestion(q); } catch(e) { PWQ.toast(String(e.message || e)); }
      render();
    };
    // 小眼睛：睁开显示，再点闭上隐藏
    d.querySelectorAll(".eye-btn").forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.eye;
        eyeState[id] = !eyeState[id];
        const span = d.querySelector("[data-exp='" + id + "']");
        if (span) span.classList.toggle("hidden", !eyeState[id]);
      };
    });
    const del = document.createElement("button");
    del.className = "ghost"; del.textContent = "删除这道题";
    del.onclick = async () => {
      if (!confirm("确定删除这道题吗？云端也会删掉。")) return;
      await PWQ.deleteQuestion(q.id); render();
    };
    const edit = document.createElement("button");
    edit.className = "secondary"; edit.textContent = "改解析";
    edit.onclick = async () => {
      const ne = prompt("改解析（改过的会标手动改过、不锁定，还能再改）：", q.explain);
      if (ne !== null) { q.explain = ne; q.edited = true; try { await PWQ.updateQuestion(q); } catch(e) { PWQ.toast(String(e.message || e)); } render(); }
    };
    d.append(edit, del);
    list.appendChild(d);
  });
}
document.getElementById("dedupBtn").onclick = async () => {
  await PWQ.ready();
  if (!PWQ.currentUser()) { PWQ.toast("请先登录。"); return; }
  const qs = sortNewToOld(PWQ.getQuestions());
  const seen = new Map();
  const dupIds = [];
  qs.forEach(q => {
    const k = normStem(q.stem);
    if (!k) return;
    if (seen.has(k)) dupIds.push(q.id);
    else seen.set(k, q.id);
  });
  if (!dupIds.length) { document.getElementById("dedupInfo").textContent = "没有发现重复题，每道题都只存了一个。"; return; }
  if (!confirm("发现 " + dupIds.length + " 道重复题，只保留每道题最新的一条，删掉其余重复的，确定吗？")) return;
  for (const id of dupIds) { try { await PWQ.deleteQuestion(id); } catch(e) {} }
  document.getElementById("dedupInfo").textContent = "已删掉 " + dupIds.length + " 道重复题。";
  render();
};
render();
</script>
</script>
<nav class="bottomnav"><a href="home.html">主页</a><a href="stats.html">统计</a><a href="index.html?account=1">我的</a></nav>
</body></html>
