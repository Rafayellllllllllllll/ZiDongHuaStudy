<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fdf8f0">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>拍照错题本 · 错题库</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="app.js"></script></head><body>
<main class="bank-main">
<div class="bank-top"><h1>错题库</h1><button type="button" class="bank-clean" id="dedupBtn" title="清理重复题">清理重复</button></div>
<p class="small bank-dedup-info" id="dedupInfo"></p>
<div id="pills" class="pills-scroll"></div>
<div id="list"></div>
<p class="bank-tools"><button class="bank-tool" onclick="window.print()">导出打印</button>
<a class="btn bank-tool" href="practice.html">去练习</a></p>
</main><footer>云端版 · 数据存在 Supabase</footer>
<div class="zyb-backdrop" id="kpBackdrop"></div><section class="kp-sheet" id="kpSheet"><div class="zyb-grab"></div><button type="button" class="zyb-close" id="kpClose">×</button><div class="kp-sheet-body" id="kpBody"></div></section>
<script>
function dynamicSubjects(){ const s = ["全部"]; allQs.forEach(q => { const sub = q.subject || "其他"; if (!s.includes(sub)) s.push(sub); }); return s; }
let allQs = [];
let currentSubject = "全部";
let eyeState = {};
function normStem(s){ return String(s || "").replace(/\s+/g, "").replace(/[，。、；：？！,.!?;:\\(\)\[\]{}]/g, ""); }
function sortNewToOld(qs){
  return [...qs].sort((a,b) => {
    const ta = a.created_at ? new Date(a.created_at).getTime() : 0;
    const tb = b.created_at ? new Date(b.created_at).getTime() : 0;
    return tb - ta;
  });
}
function renderPills(){
  const el = document.getElementById("pills");
  el.innerHTML = dynamicSubjects().map(s => "<button type='button' class='bank-pill" + (s === currentSubject ? " active" : "") + "' data-s='" + s + "'>" + s + "</button>").join("");
  el.querySelectorAll(".bank-pill").forEach(btn => {
    btn.onclick = () => { currentSubject = btn.dataset.s; render(); };
  });
}
function optionExplain(q, letter){
  // 定性辨析类：每个选项后面跟一个选项解析；定量类：只显示整体解析，不逐选项拆。
  // 选项解析来源：优先用 explain 里按 A/B/C/D 分段的内容，没有分段时用整体解析兜底，绝不编造新解析。
  const text = q.explain || "";
  const parts = {};
  const re = /([A-D])[\.、．：:]\s*([^A-D]+?)(?=(?:[A-D])[\.、．：:]|$)/g;
  let m;
  while ((m = re.exec(text)) !== null) { parts[m[1]] = m[2].trim(); }
  if (parts[letter]) return parts[letter];
  return "";
}
async function render(){
  await PWQ.ready();
  if (!PWQ.currentUser()) { document.getElementById("list").innerHTML = "<p>请先去登录页登录，登录后这里才会显示你在云端的错题。</p>"; return; }
  allQs = sortNewToOld(PWQ.getQuestions());
  if (currentSubject !== "全部" && !allQs.some(q => (q.subject || "其他") === currentSubject)) currentSubject = "全部";
  renderPills();
  const list = document.getElementById("list");
  list.innerHTML = "";
  const filtered = currentSubject === "全部" ? allQs : allQs.filter(q => (q.subject || "其他") === currentSubject);
  if (!filtered.length) {
    list.innerHTML = "<p>这里还没有" + (currentSubject === "全部" ? "" : currentSubject + "的") + "错题。先去录错题。</p>";
    return;
  }
  filtered.forEach(q => {
    const d = document.createElement("div");
    d.className = "qitem" + (q.mastered ? " mastered" : "");
    const cstDate = q.created_at ? new Date(new Date(q.created_at).getTime() + 8*60*60*1000).toISOString().slice(0,10) : "";
    const ansLetters = String(q.answer || "").toUpperCase().replace(/[^A-D]/g, "").split("");
    const optsHtml = (q.options && q.options.length) ? q.options.map(o => {
      const letter = o.trim().charAt(0).toUpperCase();
      const isAns = ansLetters.includes(letter);
      return "<div class='bank-opt " + (isAns ? "correct" : "") + "'><span>" + PWQ.escapeHtml(o) + "</span>" + (isAns ? "<span class='bank-check'>✓ 正确</span>" : "") + "</div>";
    }).join("") : "";
    const ansText = q.answer ? PWQ.escapeHtml(q.answer) + (function(){ const cs = q.options ? q.options.filter(o => ansLetters.includes(o.trim().charAt(0).toUpperCase())).map(o => o.replace(/^[A-D][\.、．：:]\s*/, "")) : []; return cs.length ? "，" + PWQ.escapeHtml(cs.join("、")) : ""; })() : "答案暂缺";
    d.innerHTML =
      "<p class='bank-tags'><span class='tag'>" + PWQ.escapeHtml(q.subject || "其他") + "</span>" +
      (q.qkind ? "<span class='tag'>" + PWQ.escapeHtml(q.qkind) + "</span>" : "") +
      "<span class='tag'>" + PWQ.escapeHtml(q.type || "") + "</span>" +
      (cstDate ? "<span class='tag'>" + cstDate + "</span>" : "") + "</p>" +
      "<p class='bank-stem'><b>" + PWQ.escapeHtml(q.stem) + "</b></p>" +
      optsHtml +
      "<p class='bank-answer'>答案：" + ansText + "</p>" +
      "<p class='bank-actions'><button type='button' class='viewBtn'>查看解析</button> <button type='button' class='secondary editBtn'>改解析</button> <button type='button' class='ghost delBtn'>删除</button></p>";
    d.querySelector(".viewBtn").onclick = () => openAnalysis(q);
    d.querySelector(".editBtn").onclick = async () => {
      const ne = prompt("改解析（改过的会标手动改过、不锁定，还能再改）：", q.explain);
      if (ne !== null) { q.explain = ne; q.edited = true; try { await PWQ.updateQuestion(q); } catch(e) { PWQ.toast(String(e.message || e)); } render(); }
    };
    d.querySelector(".delBtn").onclick = async () => {
      if (!confirm("确定删除这道题吗？云端也会删掉。")) return;
      await PWQ.deleteQuestion(q.id); render();
    };
    list.appendChild(d);
  });
}
function openAnalysis(q){
  const sheet = document.getElementById("kpSheet");
  const body = document.getElementById("kpBody");
  const backdrop = document.getElementById("kpBackdrop");
  const isQual = q.type === "定性辨析类";
  let html = "<h2>题目解析</h2>" +
    "<p><span class='tag'>" + PWQ.escapeHtml(q.subject || "其他") + "</span><span class='tag'>" + PWQ.escapeHtml(q.qkind || "") + "</span></p>" +
    "<p><b>" + PWQ.escapeHtml(q.stem) + "</b></p>";
  if (isQual) {
    // 知识辨析型：选项逐项解析，每个选项独立知识点 + 小星标
    const kps = PWQ.extractKnowledgePoints(q);
    html += q.options.map(o => {
      const letter = o.trim().charAt(0);
      const isAns = letter === q.answer;
      const kp = kps.find(k => k.name === o.replace(/^[A-D][\.、．：:]\s*/, "").trim().slice(0,24)) || kps[0];
      const kpIdVal = kp ? kp.id : PWQ.kpId(q.subject, o);
      const fav = PWQ.isKnowledgeFavorited(kpIdVal);
      const exp = optionExplain(q, letter);
      return "<div class='qitem'><p><b>" + PWQ.escapeHtml(o) + "</b> " + (isAns ? "<span class='mark'>正确答案</span>" : "<span class='mark'>错误选项</span>") + "</p>" +
        "<p>判断结果：" + (isAns ? "正确" : "错误") + "</p>" +
        "<p>选项解析：" + PWQ.escapeHtml(exp || q.explain || "") + "</p>" +
        "<p>对应知识点：" + PWQ.escapeHtml(kp ? kp.name : o) + " <button type='button' class='kp-star " + (fav ? "on" : "") + "' data-kp='" + PWQ.escapeHtml(kpIdVal) + "' data-name='" + PWQ.escapeHtml(kp ? kp.name : o) + "'>★</button></p></div>";
    }).join("");
  } else {
    // 计算型：统一解析区，不机械地为每个选项建知识点讲解
    html += "<p>正确答案：" + PWQ.escapeHtml(q.answer) + "</p>" +
      "<p>解题思路：见下面详细步骤。</p>" +
      "<p>详细计算步骤：</p><p>" + PWQ.escapeHtml(q.explain || "") + "</p>" +
      "<p>最终结论：正确答案是 " + PWQ.escapeHtml(q.answer) + "。</p>" +
      "<p>核心公式或知识点：见解析中的公式与概念，点下面星标可收藏本题知识点。</p>";
    const kps = PWQ.extractKnowledgePoints(q);
    if (kps.length) {
      const kp = kps[0];
      const fav = PWQ.isKnowledgeFavorited(kp.id);
      html += "<p>知识点：" + PWQ.escapeHtml(kp.name) + " <button type='button' class='kp-star " + (fav ? "on" : "") + "' data-kp='" + PWQ.escapeHtml(kp.id) + "' data-name='" + PWQ.escapeHtml(kp.name) + "'>★</button></p>";
    }
    if (q.options && q.options.length) {
      html += q.options.map(o => "<div class='opt " + (o.trim().charAt(0) === q.answer ? "correct" : "") + "'><span>" + PWQ.escapeHtml(o) + "</span>" + (o.trim().charAt(0) === q.answer ? "<span class='mark'>正确答案</span>" : "") + "</div>").join("");
    }
  }
  body.innerHTML = html;
  body.querySelectorAll(".kp-star").forEach(btn => {
    btn.onclick = () => {
      const kp = {id: btn.dataset.kp, name: btn.dataset.name, subject: q.subject || "其他", summary: "", detail: q.explain || "", questionIds: [q.id]};
      const fav = PWQ.toggleKnowledgePoint(kp);
      if (fav) PWQ.linkKnowledgeToQuestion(kp.id, q.id);
      btn.classList.toggle("on", fav);
      PWQ.toast(fav ? "已收藏到知识点。" : "已取消收藏。");
    };
  });
  sheet.classList.add("open");
  backdrop.classList.add("show");
  try { history.pushState({kpSheet: true}, ""); } catch(e) {}
}
document.getElementById("kpClose").onclick = () => { document.getElementById("kpSheet").classList.remove("open"); document.getElementById("kpBackdrop").classList.remove("show"); };
document.getElementById("kpBackdrop").onclick = () => { document.getElementById("kpSheet").classList.remove("open"); document.getElementById("kpBackdrop").classList.remove("show"); };
window.addEventListener("popstate", () => {
  const sheet = document.getElementById("kpSheet");
  if (sheet && sheet.classList.contains("open")) { sheet.classList.remove("open"); document.getElementById("kpBackdrop").classList.remove("show"); }
});
document.getElementById("dedupBtn").onclick = async () => {
  await PWQ.ready();
  if (!PWQ.currentUser()) { PWQ.toast("请先登录。"); return; }
  const qs = sortNewToOld(PWQ.getQuestions());
  const seen = new Map();
  const dupIds = [];
  qs.forEach(q => {
    const k = normStem(q.stem);
    if (!k) return;
    if (seen.has(k)) dupIds.push(q.id);
    else seen.set(k, q.id);
  });
  if (!dupIds.length) { document.getElementById("dedupInfo").textContent = "没有发现重复题，每道题都只存了一个。"; return; }
  if (!confirm("发现 " + dupIds.length + " 道重复题，只保留每道题最新的一条，删掉其余重复的，确定吗？")) return;
  for (const id of dupIds) { try { await PWQ.deleteQuestion(id); } catch(e) {} }
  document.getElementById("dedupInfo").textContent = "已删掉 " + dupIds.length + " 道重复题。";
  render();
};
render();
</script>
</script>
<nav class="bottomnav"><a href="home.html">主页</a><a href="stats.html">统计</a><a href="index.html?account=1">我的</a></nav>
